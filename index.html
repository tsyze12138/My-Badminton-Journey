// ---- 工具 ----
function clone(v){ return JSON.parse(JSON.stringify(v)); }
function rand(a,b){ return Math.random()*(b-a)+a; }
function rint(a,b){ return Math.floor(rand(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

function calcOVR(attrs){
  const vals = ATTR_KEYS.map(k => clamp(attrs[k]||50,1,99)).sort((a,b)=>b-a);
  let w = vals[0]*.28 + vals[1]*.22 + vals[2]*.18 + vals[3]*.14 + vals[4]*.08 + vals[5]*.05 + vals[6]*.05;
  return clamp(Math.round(w*1.12+4), 60, 99);
}

// 选手池（用于普通对手生成）
let malePool = [], femalePool = [];
function initNamePools() {
  malePool = shuffle([...MALE_PLAYERS]);
  femalePool = shuffle([...FEMALE_PLAYERS]);
}
function getOpponent(gender) {
  initNamePools();
  let pool = gender === '男' ? malePool : femalePool;
  if(pool.length === 0) {
    if(gender === '男') { malePool = shuffle([...MALE_PLAYERS]); pool = malePool; }
    else { femalePool = shuffle([...FEMALE_PLAYERS]); pool = femalePool; }
  }
  return pool.pop();
}

// ---- AI选手管理（用于排名积分） ----
let aiPlayers = [];

function initAIPlayers(gender) {
  const pool = gender === '男' ? MALE_PLAYERS : FEMALE_PLAYERS;
  const selected = shuffle([...pool]).slice(0, 20);
  aiPlayers = selected.map(p => {
    const ovr = clamp(65 + rint(0, 25), 65, 92);
    const age = rint(19, 25);
    return {
      name: p.name,
      country: p.country,
      gender: gender,
      ovr: ovr,
      age: age,
      points: 0,
    };
  });
}

function simulateAIPerformance(ai, tournament) {
  const rounds = 5;
  const strength = ai.ovr / 100;
  let wonRounds = 0;
  for (let r = 0; r < rounds; r++) {
    const winProb = strength * (0.7 + 0.3 * (1 - r/rounds));
    if (Math.random() < winProb) {
      wonRounds++;
    } else {
      break;
    }
  }
  let pts = 0;
  if (wonRounds === rounds) {
    pts = tournament.points;
  } else {
    const ratio = 0.1 + 0.6 * (wonRounds / rounds);
    pts = Math.floor(tournament.points * ratio);
  }
  return pts;
}

function updateAIPlayersForTournament(tournament) {
  if (!tournament) return;
  aiPlayers.forEach(ai => {
    const pts = simulateAIPerformance(ai, tournament);
    ai.points += pts;
  });
}

// ---- AI年龄衰减（30岁开始，35岁退役） ----
function applyAIAgeDecay(ai) {
  const age = ai.age;
  if (age < 30) return false;
  if (age >= 35) return true;
  let drop = 0;
  if (age <= 32) drop = 1;
  else if (age <= 34) drop = 2;
  ai.ovr = clamp(ai.ovr - drop, 50, 99);
  if (ai.ovr <= 55) return true;
  return false;
}

// ---- 自建选手年龄衰减（30岁开始，每年OVR下降2点，35岁退役） ----
function applyUserAgeDecay() {
  const age = STATE.age;
  if (age < 30) return false;
  if (age >= 35) {
    addNews(`🛑 强制退役`, `${STATE.playerName} 年满35岁，根据规则退役。`, '退役');
    return true;
  }
  let targetOVR = STATE.finalOVR - 2;
  if (targetOVR < 55) targetOVR = 55;
  let safety = 0;
  while (calcOVR(STATE.attrs) > targetOVR && safety < 100) {
    let key = pick(ATTR_KEYS);
    if (STATE.attrs[key] > 35) {
      STATE.attrs[key]--;
    }
    safety++;
  }
  STATE.finalOVR = calcOVR(STATE.attrs);
  addNews(`📉 年龄衰退`, `${STATE.playerName} 已${age}岁，身体机能下降，OVR降至${STATE.finalOVR}（-2）。`, '衰减');
  if (STATE.finalOVR <= 55) {
    addNews(`🛑 能力下滑退役`, `${STATE.playerName} 因能力下滑严重，选择退役。`, '退役');
    return true;
  }
  return false;
}

// ---- 比赛模拟（平衡版：随机性适当回调） ----
function simulateMatch(p1, p2){
  const ovr1 = p1.ovr||75, ovr2 = p2.ovr||75;
  const a1 = p1.attrs||STATE.attrs, a2 = p2.attrs||{speed:50,power:50,stamina:50,technique:50,mental:50,agility:50,reflex:50};
  const bonus1 = (a1.speed||50)/100*0.15 + (a1.power||50)/100*0.15 + (a1.technique||50)/100*0.2 + (a1.mental||50)/100*0.1;
  const bonus2 = (a2.speed||50)/100*0.15 + (a2.power||50)/100*0.15 + (a2.technique||50)/100*0.2 + (a2.mental||50)/100*0.1;
  let s1 = ovr1/100*0.6 + bonus1*0.4, s2 = ovr2/100*0.6 + bonus2*0.4;
  // 随机波动系数略微放宽，给弱者更多机会（0.93~1.07）
  s1 *= (0.93 + Math.random() * 0.14);
  s2 *= (0.93 + Math.random() * 0.14);
  if(p1.isUser) s1 *= 1.02;
  if(p2.isUser) s2 *= 1.02;
  const p1Win = s1/(s1+s2);
  let sets=[], p1Sets=0, p2Sets=0;
  while(p1Sets<2 && p2Sets<2){
    let sc1=0, sc2=0;
    while(sc1<21 && sc2<21){ if(Math.random()<p1Win) sc1++; else sc2++; }
    while(Math.abs(sc1-sc2)<2){ if(Math.random()<p1Win) sc1++; else sc2++; }
    sets.push({p1:sc1, p2:sc2});
    if(sc1>sc2) p1Sets++; else p2Sets++;
  }
  const winner = p1Sets>p2Sets ? p1 : p2;
  const loser = p1Sets>p2Sets ? p2 : p1;
  return { winner, loser, score: sets.map(s=>`${s.p1}-${s.p2}`).join(' '), p1Sets, p2Sets, sets };
}

// ---- 生成对手（平衡版：历史巨星概率28%，基础OVR 68） ----
function generateOpponent(round, tier, gender) {
  // 28%概率选择历史巨星（从40%下调）
  if (Math.random() < 0.28) {
    const candidates = HISTORICAL_STARS.filter(s => s.gender === gender && s.type === '单打');
    if (candidates.length > 0) {
      const star = pick(candidates);
      const attrs = {};
      ATTR_KEYS.forEach(k => {
        let val = star.attrs[k] || 50;
        // 微调波动范围缩小，避免出现极端低值
        val = clamp(val + rint(-2, 2), 45, 99);
        attrs[k] = val;
      });
      const ovr = calcOVR(attrs);
      return {
        name: star.name,
        country: star.country,
        ovr: ovr,
        attrs: attrs,
        isUser: false,
        isStar: true
      };
    }
  }
  // 普通对手：基础值从72下调至68，后期成长略减
  const base = 68 + round * 2 + (tier === '超级1000' ? 6 : tier === '超级750' ? 4 : tier === '超级500' ? 2 : 0);
  const ovr = clamp(base + rint(-5, 5), 58, 95);
  const player = getOpponent(gender);
  return {
    name: player.name,
    country: player.country,
    ovr: ovr,
    attrs: {
      speed: clamp(50 + rint(-15, 20), 30, 99),
      power: clamp(50 + rint(-15, 20), 30, 99),
      stamina: clamp(50 + rint(-15, 20), 30, 99),
      technique: clamp(50 + rint(-15, 20), 30, 99),
      mental: clamp(50 + rint(-15, 20), 30, 99),
      agility: clamp(50 + rint(-15, 20), 30, 99),
      reflex: clamp(50 + rint(-15, 20), 30, 99),
    },
    isUser: false,
    isStar: false
  };
}

const ROUND_NAMES = ['1/16决赛（32强）', '1/8决赛（16强）', '1/4决赛', '半决赛', '决赛'];

function simulateOneTournament() {
  let tList = STATE.tournaments;
  if (!tList || tList.length === 0) { STATE.tournaments = getSeasonTournaments(); STATE.tournamentIndex = 0; render(); return null; }
  if (tList.every(t => t.played)) { finishSeason(); return null; }
  let idx = STATE.tournamentIndex;
  while (idx < tList.length && tList[idx].played) idx++;
  if (idx >= tList.length) { finishSeason(); return null; }
  const tourn = tList[idx];
  STATE.currentTournament = tourn;
  STATE.tournamentIndex = idx;

  let userAvailable = true;
  if (STATE.userInjury && STATE.userInjury.gamesOut > 0) {
    userAvailable = false;
    STATE.userInjury.gamesOut--;
    addNews(`📌 伤病休战`, `${STATE.playerName} 因${STATE.userInjury.name}，缺席${tourn.name}。`, '伤病');
    tourn.played = true;
    tourn.result = { champion: null, bestRound: 0, points: 0, matches: [], skipped: true };
    updateAIPlayersForTournament(tourn);
    updateWorldRank();
    return null;
  }

  const rounds = 5;
  let player = { name: STATE.playerName, country: STATE.country, ovr: STATE.finalOVR, attrs: STATE.attrs, isUser: true };
  let results = [];
  let wonCount = 0;
  for (let r = 0; r < rounds; r++) {
    if (!player) break;
    const opp = generateOpponent(r, tourn.tier, STATE.gender);
    const match = simulateMatch(player, opp);
    const won = match.winner.isUser;
    results.push({ round: r+1, roundName: ROUND_NAMES[r], opponent: opp.name, country: opp.country, ovr: opp.ovr, won, score: match.score, isStar: opp.isStar });
    if (won) {
      wonCount++;
      player = { ...player };
    } else {
      player = null;
      break;
    }
  }
  const isChampion = player !== null && results.length === rounds && results.every(r => r.won);
  if (isChampion) {
    STATE.careerStats.titles++;
    if (tourn.tier === '超级1000') STATE.careerStats.super1000++;
    else if (tourn.tier === '超级750') STATE.careerStats.super750++;
    else if (tourn.tier === '超级500') STATE.careerStats.super500++;
    else if (tourn.tier === '超级300') STATE.careerStats.super300++;
    STATE.careerStats.careerPrize = (STATE.careerStats.careerPrize || 0) + (tourn.prize || 0);
    addNews(`🏆 ${tourn.name} 夺冠！`, `${STATE.playerName} 在${tourn.tier}赛事中夺冠！奖金 $${tourn.prize}万`, '冠军');
  } else {
    const best = results.filter(r => r.won).length;
    const roundName = best < rounds ? ROUND_NAMES[best] : '决赛';
    addNews(`📊 ${tourn.name}`, `${STATE.playerName} 止步${roundName}。`, '赛事');
  }

  let pts = 0;
  if (isChampion) {
    pts = tourn.points;
  } else {
    const wonRounds = results.filter(r => r.won).length;
    const ratio = 0.1 + 0.6 * (wonRounds / rounds);
    pts = Math.floor(tourn.points * ratio);
  }
  STATE.rankPoints += pts;
  STATE.seasonStats.gp += results.length;
  STATE.seasonStats.wins += results.filter(r => r.won).length;
  STATE.seasonStats.losses += results.filter(r => !r.won).length;
  if (isChampion) STATE.seasonStats.titles++;
  STATE.careerStats.gp += results.length;
  STATE.careerStats.wins += results.filter(r => r.won).length;
  STATE.careerStats.losses += results.filter(r => !r.won).length;

  tourn.played = true;
  tourn.result = { champion: isChampion ? STATE.playerName : null, bestRound: results.filter(r => r.won).length, points: pts, matches: results };

  updateAIPlayersForTournament(tourn);
  updateWorldRank();

  STATE.matchLog.unshift({ tournament: tourn.name, tier: tourn.tier, result: isChampion ? '冠军' : `${ROUND_NAMES[results.filter(r => r.won).length] || '首轮'}`, points: pts, date: `${STATE.seasonYear}-${String(rint(1,12)).padStart(2,'0')}` });
  STATE.currentTournament = tourn;
  return { tourn, results, isChampion, pts };
}

function simulateTournament() {
  const result = simulateOneTournament();
  if (result === null) {
    if (STATE.tournaments.every(t => t.played)) {
      finishSeason();
    } else {
      STATE.step = 'dashboard';
      render();
    }
    return;
  }
  STATE.step = 'tournamentResult';
  render();
}

// ---- 世界排名 ----
function updateWorldRank(){
  const allPlayers = [
    { name: STATE.playerName, points: STATE.rankPoints, isUser: true },
    ...aiPlayers.map(ai => ({ name: ai.name, points: ai.points, isUser: false }))
  ];
  allPlayers.sort((a,b) => b.points - a.points);
  const rankMap = {};
  allPlayers.forEach((p, idx) => {
    rankMap[p.name] = idx + 1;
  });
  STATE.worldRank = rankMap[STATE.playerName] || 50;
  if (STATE.worldRank < STATE.careerStats.bestRank) STATE.careerStats.bestRank = STATE.worldRank;
  if (STATE.worldRank === 1) STATE.careerStats.weeksAtNo1 = (STATE.careerStats.weeksAtNo1 || 0) + 1;

  const ranked = allPlayers.slice(0, 20).map((p, i) => ({
    rank: i+1,
    name: p.name,
    points: Math.round(p.points),
    isUser: p.isUser
  }));
  STATE.worldRankings = ranked;
}

// ---- 赛季总结 ----
function finishSeason() {
  updateWorldRank();
  const season = {
    year: STATE.seasonYear,
    gp: STATE.seasonStats.gp,
    wins: STATE.seasonStats.wins,
    losses: STATE.seasonStats.losses,
    titles: STATE.seasonStats.titles || 0,
    rank: STATE.worldRank,
    points: STATE.rankPoints,
  };
  STATE.seasonSummary = season;

  STATE.rankPoints = Math.round(STATE.rankPoints * 0.7);
  aiPlayers.forEach(ai => {
    ai.points = Math.round(ai.points * 0.7);
  });

  STATE.step = 'seasonSummary';
  render();
}

function goToOffseason() {
  prepareGrowth();
}

// ---- 随机事件 ----
function triggerRandomEvent(){
  if (STATE.seasonEventsTriggered >= 5) return;
  const events = [
    {type:'injury', title:'轻微伤病', detail:'训练中扭伤', minOut:1,maxOut:3,drop:0},
    {type:'positive', title:'状态爆发', detail:'技术全面提升', positive:true, amount:1},
    {type:'fun', title:'趣闻', detail:'社交媒体热传', impact:'无影响'}
  ];
  const ev = pick(events);
  const display = { target: STATE.playerName, title: ev.title, detail: ev.detail, impact: '' };
  if (ev.positive) {
    const key = pick(ATTR_KEYS);
    STATE.attrs[key] = clamp(STATE.attrs[key] + ev.amount, 1, 99);
    STATE.finalOVR = calcOVR(STATE.attrs);
    display.impact = `${getAttrCN(key)}+${ev.amount}`;
    addNews(`✨ ${STATE.playerName}：${ev.title}`, `${ev.detail}。${display.impact}`, '成长');
  } else if (ev.type === 'injury') {
    const out = rint(ev.minOut, ev.maxOut);
    STATE.userInjury = { gamesOut: out, name: ev.title, detail: ev.detail, ovrDrop: 0 };
    display.impact = `休战${out}场`;
    addNews(`🚑 ${STATE.playerName}：${ev.title}`, `${ev.detail}。${display.impact}`, '伤病');
  } else {
    display.impact = '无重大影响';
    addNews(`📰 ${STATE.playerName}：${ev.title}`, `${ev.detail}`, '花絮');
  }
  STATE.seasonEventsTriggered++;
  STATE.eventHistory.unshift(display);
  if (STATE.eventHistory.length > 100) STATE.eventHistory.length = 100;
}

// ---- AI年龄处理 ----
function processAIAgingAndRetirement() {
  const toRemove = [];
  aiPlayers.forEach((ai, idx) => {
    ai.age += 1;
    const retired = applyAIAgeDecay(ai);
    if (retired) {
      addNews(`👋 AI退役`, `${ai.name}（${ai.age}岁）因年龄或能力下滑，宣布退役。`, '退役');
      toRemove.push(idx);
    }
  });
  toRemove.sort((a,b)=>b-a).forEach(idx => {
    aiPlayers.splice(idx, 1);
  });
  while (aiPlayers.length < 20) {
    const pool = STATE.gender === '男' ? MALE_PLAYERS : FEMALE_PLAYERS;
    const available = pool.filter(p => !aiPlayers.some(ai => ai.name === p.name));
    if (available.length === 0) break;
    const newPlayer = pick(available);
    const ovr = clamp(65 + rint(0, 25), 65, 92);
    const age = rint(19, 25);
    aiPlayers.push({
      name: newPlayer.name,
      country: newPlayer.country,
      gender: STATE.gender,
      ovr: ovr,
      age: age,
      points: 0,
    });
    addNews(`🌟 新星登场`, `${newPlayer.name}（${age}岁）加入职业赛场，OVR ${ovr}。`, '新秀');
  }
}

// ---- 休赛期准备 ----
function prepareGrowth(){
  STATE.age++;
  const userRetired = applyUserAgeDecay();
  if (userRetired) {
    STATE.step = 'retired';
    render();
    return;
  }
  processAIAgingAndRetirement();
  updateWorldRank();

  STATE.remainingPoints = 5;
  STATE.tempAllocated = {};
  STATE.step = 'allocation';
  render();
}

// ---- 模拟本赛季剩余全部比赛 ----
function simulateRemainingSeason() {
  const remaining = STATE.tournaments.filter(t => !t.played);
  if (remaining.length === 0) {
    if (STATE.tournaments.every(t => t.played)) {
      finishSeason();
    }
    render();
    return;
  }

  let safety = 0;
  while (!STATE.tournaments.every(t => t.played) && safety < 100) {
    safety++;
    const result = simulateOneTournament();
    if (result === null) {
      continue;
    }
    if (STATE.step === 'seasonSummary' || STATE.step === 'offseason' || STATE.step === 'allocation' || STATE.step === 'retired') {
      break;
    }
  }
  if (STATE.tournaments.every(t => t.played) && STATE.step !== 'seasonSummary' && STATE.step !== 'offseason' && STATE.step !== 'allocation' && STATE.step !== 'retired') {
    finishSeason();
  }
  render();
}

function beginBuild(){
  const n = document.getElementById('nameInput')?.value.trim();

  if(countrySelect) STATE.country = countrySelect.value;
  STATE.step = 'build';
  STATE.currentAttrIndex = 0;
  STATE.attrs = {speed:50, power:50, stamina:50, technique:50, mental:50, agility:50, reflex:50};
  STATE.rerollsLeft = 3;
  render();
}

function renderBuild(){
  const key = ATTR_KEYS[STATE.currentAttrIndex];
  const cnKey = getAttrCN(key);
  let candidates = HISTORICAL_STARS.filter(s => s.gender === STATE.gender);
  candidates = shuffle(candidates).slice(0, 6);
  if(candidates.length===0) candidates = shuffle([...HISTORICAL_STARS]).slice(0,6);

  return `<div><div class="mb-4"><h2 class="font-black text-lg">属性抽签：<span class="text-emerald-600">${cnKey}</span></h2><p class="text-xs text-slate-500 mt-1">从${STATE.gender}单打历史巨星中选择</p></div>
  <div class="space-y-2">${candidates.map((s,i) => {
    let val = s.attrs[key];
    if(val===undefined || val===null) val = 50;
    const lowered = Math.round(clamp(val * 0.78 + rint(-1, 3), 48, 80));
    return `<div class="flex justify-between items-center p-3 rounded-xl border border-slate-200 bg-slate-50"><div><b class="text-sm">${s.name}</b><div class="text-xs text-emerald-600 mt-1">${cnKey}：<b>${lowered}</b> (原${val})</div></div><button onclick='pickAttr(${JSON.stringify(s)}, "${key}", ${lowered})' class="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg">锁定</button></div>`;
  }).join('')}</div>

}

function pickAttr(star, key, loweredVal){
  STATE.attrs[key] = loweredVal;
  STATE.currentAttrIndex++;
  if(STATE.currentAttrIndex >= ATTR_KEYS.length){
    STATE.finalOVR = calcOVR(STATE.attrs);
    STATE.step = 'reveal';
  }
  render();
}

function rerollBuild(){
  if(STATE.rerollsLeft > 0){ STATE.rerollsLeft--; render(); }
  else alert('没有刷新次数了。');
}

function renderReveal(){

}

function playNextTournament(){
  if (Math.random() < 0.15) triggerRandomEvent();
  simulateTournament();
}

function renderTournamentResult(){
  const t = STATE.currentTournament;
  if(!t || !t.result){ STATE.step='dashboard'; render(); return; }
  const r = t.result;
  const isChampion = r.champion === STATE.playerName;
  const matches = r.matches || [];

// ---- 休赛期与加点 ----
function renderOffseason(){

}

function renderAllocation(){
  return `<div><div class="text-center mb-4"><h2 class="text-xl font-black">⚡ 休赛期训练成长</h2><p class="text-xs text-slate-500">剩余：<b class="text-emerald-600">${STATE.remainingPoints}</b> 点</p></div>
  <div class="space-y-2">${ATTR_KEYS.map(k => { const v = STATE.attrs[k]||50; const a = STATE.tempAllocated[k]||0; return `<div class="flex justify-between items-center p-3 bg-slate-50 border rounded-xl"><div><b class="text-sm">${getAttrCN(k)}</b><div class="text-xs text-emerald-600">当前 ${v}${a ? ` <span class="text-green-600">(+${a})</span>` : ''}</div></div><div class="flex items-center gap-2"><button onclick="subPoint('${k}')" class="w-7 h-7 rounded-lg bg-slate-200">−</button><b>${v+a}</b><button onclick="addPoint('${k}')" class="w-7 h-7 rounded-lg bg-emerald-600 text-white">+</button></div></div>`}).join('')}</div>
  <button onclick="confirmGrowth()" class="w-full mt-4 bg-emerald-600 text-white font-bold py-3 rounded-xl">✅ 确认成长，进入下一赛季</button>
  <button onclick="skipGrowth()" class="w-full mt-2 bg-slate-100 border font-semibold py-3 rounded-xl">⏩ 跳过成长（不推荐）</button></div>`;
}

function addPoint(k){
  if(STATE.remainingPoints > 0 && STATE.attrs[k] < 99){
    STATE.tempAllocated[k] = (STATE.tempAllocated[k]||0) + 1;
    STATE.remainingPoints--;
    render();
  }
}
function subPoint(k){
  if((STATE.tempAllocated[k]||0) > 0){
    STATE.tempAllocated[k]--;
    STATE.remainingPoints++;
    render();
  }
}
function confirmGrowth(){
  ATTR_KEYS.forEach(k => {
    const add = STATE.tempAllocated[k] || 0;
    if(add>0) STATE.attrs[k] = clamp(STATE.attrs[k] + add, 1, 99);
  });
  STATE.finalOVR = calcOVR(STATE.attrs);
  STATE.tempAllocated = {};
  STATE.careerSeason++;
  STATE.seasonYear++;
  STATE.seasonStats = {gp:0, wins:0, losses:0, titles:0, points:0, rank:999};
  STATE.tournaments = getSeasonTournaments();
  STATE.tournamentIndex = 0;
  STATE.userInjury = {gamesOut:0, name:'', detail:'', ovrDrop:0};
  STATE.userInjuryEventsThisSeason = 0;
  STATE.seasonEventsTriggered = 0;
  STATE.eventHistory = [];
  addNews(`📅 ${STATE.seasonYear} 新赛季`, `${STATE.playerName} 第${STATE.careerSeason}赛季，年龄${STATE.age}，OVR ${STATE.finalOVR}`, '赛季');
  STATE.step = 'dashboard';
  render();
}

function skipGrowth(){
  STATE.careerSeason++;
  STATE.seasonYear++;
  STATE.seasonStats = {gp:0, wins:0, losses:0, titles:0, points:0, rank:999};
  STATE.tournaments = getSeasonTournaments();
  STATE.tournamentIndex = 0;
  STATE.userInjury = {gamesOut:0, name:'', detail:'', ovrDrop:0};
  STATE.userInjuryEventsThisSeason = 0;
  STATE.seasonEventsTriggered = 0;
  STATE.eventHistory = [];
  addNews(`📅 ${STATE.seasonYear} 新赛季`, `${STATE.playerName} 第${STATE.careerSeason}赛季`, '赛季');
  STATE.step = 'dashboard';
  render();
}

// ---- 生涯类比函数 ----
function getPlayerAnalogy(gender, titles, super1000, weeksAtNo1, winRate) {
  const norm = (val, min, max) => clamp((val - min) / (max - min), 0, 1);
  const prototypes = gender === '男' ? [
    { name: '林丹', desc: '羽坛GOAT，统治力无与伦比', titles:150, super1000:30, weeks:200, winRate:90 },
    { name: '李宗伟', desc: '悲情英雄，世界第一周数极长', titles:90, super1000:15, weeks:180, winRate:88 },
    { name: '谌龙', desc: '稳定输出，大赛型选手', titles:65, super1000:12, weeks:60, winRate:82 },
    { name: '安赛龙', desc: '当代统治者，进攻犀利', titles:60, super1000:18, weeks:60, winRate:84 },
    { name: '桃田贤斗', desc: '巅峰期无敌，但生涯短暂', titles:50, super1000:12, weeks:60, winRate:86 },
    { name: '石宇奇', desc: '技术流，伤病影响巅峰', titles:35, super1000:6, weeks:30, winRate:75 },
    { name: '李诗沣', desc: '新生代希望，潜力巨大', titles:20, super1000:3, weeks:15, winRate:68 },
    { name: '金廷', desc: '暴力进攻，但稳定性稍欠', titles:40, super1000:8, weeks:40, winRate:72 },
    { name: '乔纳坦', desc: '全能型，但缺乏顶级荣誉', titles:30, super1000:5, weeks:20, winRate:70 }
  ] : [
    { name: '张宁', desc: '两届奥运冠军，大心脏', titles:85, super1000:15, weeks:80, winRate:82 },
    { name: '戴资颖', desc: '天才少女，世界第一周数纪录', titles:70, super1000:12, weeks:180, winRate:86 },
    { name: '马林', desc: '三届世锦赛冠军，暴力打法', titles:55, super1000:10, weeks:40, winRate:80 },
    { name: '陈雨菲', desc: '奥运冠军，新一代领军人物', titles:45, super1000:8, weeks:30, winRate:76 },
    { name: '山口茜', desc: '跑不死的小马达，稳定性高', titles:38, super1000:6, weeks:60, winRate:75 },
    { name: '奥原希望', desc: '韧性十足，防守反击', titles:28, super1000:4, weeks:30, winRate:70 },
    { name: '辛杜', desc: '大赛型选手，世锦赛冠军', titles:30, super1000:5, weeks:20, winRate:68 },
    { name: '因达农', desc: '天才少女，但起伏较大', titles:25, super1000:3, weeks:15, winRate:65 }
  ];

  const maxT = 200, minT = 0;
  const maxS = 50, minS = 0;
  const maxW = 300, minW = 0;
  const maxWR = 100, minWR = 0;

  let best = null;
  let bestDist = Infinity;

  prototypes.forEach(p => {
    const dT = Math.pow(norm(titles, minT, maxT) - norm(p.titles, minT, maxT), 2);
    const dS = Math.pow(norm(super1000, minS, maxS) - norm(p.super1000, minS, maxS), 2);
    const dW = Math.pow(norm(weeksAtNo1, minW, maxW) - norm(p.weeks, minW, maxW), 2);
    const dWR = Math.pow(norm(winRate, minWR, maxWR) - norm(p.winRate, minWR, maxWR), 2);
    const dist = dT*0.3 + dS*0.3 + dW*0.25 + dWR*0.15;
    if (dist < bestDist) {
      bestDist = dist;
      best = p;
    }
  });

  return best;
}

  </div>
  <p class="text-[10px] text-slate-400 mt-3">历史地位基于生涯数据、冠军荣誉、排名表现自动生成。</p>
  <button onclick="resetGame()" class="w-full mt-5 bg-emerald-600 text-white font-bold py-3 rounded-xl">🔄 新生涯</button></div>`;
}

function getHistoricalLegacy(){
  const c = STATE.careerStats;
  const titles = c.titles||0, wins=c.wins||0, gp=c.gp||0, winRate=gp>0?wins/gp:0;
  const super1000 = c.super1000||0, weeks = c.weeksAtNo1||0;
  const score = titles*2.5 + super1000*1.8 + weeks*0.3 + winRate*30;
  let tier, grade, strengths=[], evalText;
  if(score>=60 || titles>=15 || super1000>=8){
    tier='🏆 羽坛传奇'; grade='历史顶级巨星';
    strengths=[`${titles}冠`, `${super1000}个超级1000`, `${weeks}周世界第一`];
    evalText='他是羽毛球历史上最伟大的选手之一。';
  } else if(score>=35 || titles>=8 || super1000>=4){
    tier='🌟 世界级巨星'; grade='羽坛名将';
    strengths=[`${titles}冠`, `${super1000}个超级1000`, `胜率${Math.round(winRate*100)}%`];
    evalText='他是一位世界级的羽毛球选手，拥有辉煌的职业生涯。';
  } else if(score>=18 || titles>=3 || super1000>=1){
    tier='🏅 国际级选手'; grade='巡回赛冠军级';
    strengths=[`${titles}冠`, `${super1000}个超级1000`, `最高排名#${c.bestRank||STATE.worldRank}`];
    evalText='他是一位出色的国际级选手，在BWF巡回赛中取得了不俗的成就。';
  } else {
    tier='🎯 职业选手'; grade='巡回赛常客';
    strengths=[`${titles}冠`, `胜率${Math.round(winRate*100)}%`];
    evalText='他是一位勤奋的职业选手，在羽毛球赛场上留下了自己的足迹。';
  }
  return { tier, grade, strengths: strengths.join('、') || '稳定的职业生涯', evalText, typeRank: `${STATE.gender}单打选手`, peakOvr: STATE.finalOVR };
}
