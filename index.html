function calcOVR(attrs){
  const vals = ATTR_KEYS.map(k => clamp(attrs[k]||50,1,99)).sort((a,b)=>b-a);
  const w = vals[0]*0.20 + vals[1]*0.16 + vals[2]*0.14 + vals[3]*0.12 + vals[4]*0.11 + vals[5]*0.10 + vals[6]*0.09 + vals[7]*0.08;
  return clamp(Math.round(w*1.05+3), 40, 99);
}
function getSeasonTournaments(gender, year){
  const regular = shuffle([...TOURNAMENTS]).slice(0,16).map((t,i)=>({...t, played:false, result:null, isMajor:false}));
  const majors = [];
  if(year % 4 === 0){
    majors.push({...MAJOR_EVENTS.olympics, played:false, result:null, isMajor:true});
  } else {
    majors.push({...MAJOR_EVENTS.worlds, played:false, result:null, isMajor:true});
  }
  if(year % 2 === 0){
    const cup = gender === '男' ? MAJOR_EVENTS.thomas : MAJOR_EVENTS.uber;
    majors.push({...cup, played:false, result:null, isMajor:true});
  } else {
    majors.push({...MAJOR_EVENTS.sudirman, played:false, result:null, isMajor:true});
  }
  const all = [...regular];
  majors.forEach((m, idx) => {
    const pos = majors.length === 1 ? 8 : (idx === 0 ? 5 : 13);
    all.splice(pos, 0, m);
  });
  return all.map((t,i)=>({...t, id:i}));
}
function initPotential(attrs){
  const pot = {};
  ATTR_KEYS.forEach(k=>{ pot[k] = clamp((attrs[k]||50) + 15 + rint(0,12), attrs[k]||50, 99); });
  return pot;
}

}
function hasTrait(key){
  return (STATE.traits||[]).some(t => t === key+'_1' || t === key+'_2');

function getEffectiveAttrsFrom(state){
  const eff = {...state.attrs};
  if(state.equipment){
    EQUIPMENTS.forEach(eq=>{
      const lvl = state.equipment[eq.id] || 0;
      if(lvl > 0){
        const bonus = eq.levels[lvl-1].bonus;
        Object.keys(bonus).forEach(k=>{ eff[k] = clamp((eff[k]||50) + bonus[k], 0, 99); });
      }
    });
  }
  return eff;
}

function initNamePools(){ malePool = shuffle([...MALE_PLAYERS]); femalePool = shuffle([...FEMALE_PLAYERS]); }
function getOpponent(gender){

let aiPlayers = [];
function generateAIAttrs(targetOvr){
  const baseX = clamp((targetOvr - 3) / 1.05, 30, 96);
  const attrs = {};
  ATTR_KEYS.forEach(k=>{ attrs[k] = clamp(Math.round(baseX + rint(-6, 6)), 30, 99); });
  for(let i=0;i<30;i++){
    const cur = calcOVR(attrs);
    if(Math.abs(cur - targetOvr) <= 1) break;
    const adjust = cur > targetOvr ? -1 : 1;
    const k = ATTR_KEYS[Math.floor(Math.random()*ATTR_KEYS.length)];
    attrs[k] = clamp(attrs[k] + adjust, 30, 99);
  }
  return attrs;
}
function initAIPlayers(gender){
  const pool = gender === '男' ? MALE_PLAYERS : FEMALE_PLAYERS;
  aiPlayers = shuffle([...pool]).slice(0,20).map(p=>{
    const attrs = generateAIAttrs(p.ovr || 80);
    return {name:p.name, country:p.country, gender, ovr: calcOVR(attrs), attrs, points: 0};
  });
}
function simulateAIPerformance(ai, tournament){
  const strength = ai.ovr/100;
  let won = 0;
  for(let r=0;r<5;r++){
    const p = strength * (0.95 - r*0.06);
    if(Math.random() < p) won++; else break;
  }
  if(won === 5) return tournament.points;
  return Math.floor(tournament.points * (0.1 + 0.6 * (won/5)));
}
function updateAIPlayersForTournament(t){
  if(!t) return;
  aiPlayers.forEach(ai => { ai.points += simulateAIPerformance(ai, t); });
}

function applyAgeDecay(){
  const age = STATE.age;
  if(age >= 30){
    let drop = age<=32?1:age<=34?2:3;
    const keys = shuffle([...ATTR_KEYS]);
    let totalDrop = drop;
    for(const k of keys){
      if(totalDrop<=0) break;
      if(STATE.attrs[k]>40){
        const d = Math.min(totalDrop,2);
        STATE.attrs[k] = clamp(STATE.attrs[k]-d,35,99);
        totalDrop -= d;
      }
    }
    STATE.finalOVR = calcOVR(STATE.attrs);
    updateTraits();
    addNews(`📉 年龄影响`,`${STATE.playerName} 已${age}岁，身体机能下降，OVR降至${getEffectiveOVR()}`,'衰减');

      STATE.step = 'retired';
      render();
      return true;
    }
  }
  return false;
}

function calcBaseWinProb(player, opp, userMod){

  const s1 = (ovr1/100) * userMod;
  const s2 = (ovr2/100);
  return clamp(s1/(s1+s2), 0.05, 0.95);
}
function generateOpponent(round, tier, gender){
  const tierBonus = tier==='超级1000'?8 : tier==='超级750'?6 : tier==='超级500'?4 : 2;
  const base = 62 + round*2.5 + tierBonus;
  const ovr = clamp(base + rint(-4,6), 55, 96);
  const player = getOpponent(gender);
  const scale = (ovr - 55) / 41;
  const attrs = {};
  ATTR_KEYS.forEach(k=>{ attrs[k] = clamp(Math.round(45 + scale*45 + rint(-8,8)), 30, 99); });
  return {name:player.name, country:player.country, ovr, attrs, isUser:false};
}
function generateMajorOpponent(round, gender){
  const base = 86 + round*2;
  const ovr = clamp(base + rint(-3,6), 82, 99);
  const player = getOpponent(gender);
  const scale = (ovr - 70) / 29;
  const attrs = {};
  ATTR_KEYS.forEach(k=>{ attrs[k] = clamp(Math.round(65 + scale*30 + rint(-6,6)), 50, 99); });
  return {name:player.name, country:player.country, ovr, attrs, isUser:false};

function isSetOver(cs){
  if(cs.p1 >= 21 && cs.p1 - cs.p2 >= 2) return true;
  if(cs.p2 >= 21 && cs.p2 - cs.p1 >= 2) return true;
  return false;
}
function shouldTriggerDecision(cs){
  const p1 = cs.p1, p2 = cs.p2;
  if(p1 < 16 && p2 < 16) return false;
  if(Math.abs(p1 - p2) > 4) return false;
  if(p1 >= 20 || p2 >= 20) return true;
  if(p1 >= 19 && p2 >= 19) return true;
  if(p1 >= 18 && p2 >= 18) return true;
  return false;
}
function calcShotSuccess(shot, playerAttrs, oppAttrs){
  const pVal = (playerAttrs[shot.primary]||50) * 0.55 + (playerAttrs[shot.secondary]||50) * 0.45;
  const oVal = (oppAttrs[shot.counter]||50);
  let rate = shot.baseRate;
  rate += (pVal - 55) / 100 * 0.35;
  rate -= (oVal - 55) / 100 * 0.25;
  rate += ((playerAttrs.mental||50) - 50) / 200;
  rate += STATE.momentum * 0.02;
  rate -= (100 - STATE.stamina) / 100 * 0.10;
  if(hasTrait('technique')) rate += 0.02;
  if(hasTrait('mental')) rate += 0.03;
  if(hasTrait('defense')) rate += 0.02;
  const shotTraits = SHOT_TRAIT_MAP[shot.id] || [];
  shotTraits.forEach(t => { if(hasTrait(t)) rate += 0.04; });
  return clamp(rate, 0.15, 0.90);
}

  render();
  setTimeout(advanceRound, 350);
}
function advanceRound(){
  const ms = STATE.matchState;
  if(!ms || ms.finished) return;
  if(ms.roundIndex >= 5){ finishMatchSimulation(); return; }
  const opp = ms.isMajor
    ? generateMajorOpponent(ms.roundIndex, STATE.gender)
    : generateOpponent(ms.roundIndex, ms.tournament.tier, STATE.gender);
  const userMod = getStaminaModifier() * getMomentumModifier();
  const effAttrs = getEffectiveAttrs();
  const player = {name: STATE.playerName, ovr: getEffectiveOVR(), attrs: effAttrs, isUser: true};
  const baseWinProb = calcBaseWinProb(player, opp, userMod);
  ms.currentRound = {
    opp, player, sets: [], p1Sets: 0, p2Sets: 0,
    currentSet: {p1: 0, p2: 0},
    decisionUsed: false, p1Win: baseWinProb, userMod
  };
  render();
  simulateRound();
}
function simulateRound(){
  const ms = STATE.matchState;
  if(!ms || !ms.currentRound) return;
  const cr = ms.currentRound;
  let safety = 0;
  while(cr.p1Sets < 2 && cr.p2Sets < 2 && safety < 400){
    safety++;
    const cs = cr.currentSet;
    if(isSetOver(cs)){
      cr.sets.push({p1: cs.p1, p2: cs.p2});
      if(cs.p1 > cs.p2) cr.p1Sets++; else cr.p2Sets++;
      cr.currentSet = {p1: 0, p2: 0};
      continue;
    }
    if(!cr.decisionUsed && shouldTriggerDecision(cs)){
      setupDecision();
      return;
    }
    const pointWinProb = clamp(cr.p1Win * (0.88 + Math.random()*0.24), 0.05, 0.95);
    if(Math.random() < pointWinProb) cs.p1++; else cs.p2++;
  }
  if(cr.p1Sets >= 2 || cr.p2Sets >= 2){ endRound(); }
}
function setupDecision(){
  const ms = STATE.matchState;
  const cr = ms.currentRound;
  const cs = cr.currentSet;
  let context = '关键分';
  if(cs.p1 >= 20 || cs.p2 >= 20){
    if(cs.p1 >= 20 && cs.p1 >= cs.p2) context = '局点';
    else if(cs.p2 >= 20) context = '对手局点';
    if(cr.p1Sets === 1 && cr.p2Sets === 1 && context === '局点') context = '赛点';
    else if(cr.p1Sets === 1 && context === '局点') context = '赛点';
  } else if(cs.p1 >= 19 && cs.p2 >= 19){
    context = '平分';
  }
  const options = shuffle([...SHOTS]).slice(0, 3);
  STATE.decisionPoint = {context, score: {p1: cs.p1, p2: cs.p2}, options};
  STATE.step = 'decision';
  render();
}
function resolveDecision(shotId){
  const ms = STATE.matchState;
  const dp = STATE.decisionPoint;
  if(!ms || !ms.currentRound || !dp) return;
  const cr = ms.currentRound;
  const shot = SHOTS.find(s => s.id === shotId);
  if(!shot) return;
  const successRate = calcShotSuccess(shot, cr.player.attrs, cr.opp.attrs);
  const success = Math.random() < successRate;
  if(success) cr.currentSet.p1++; else cr.currentSet.p2++;
  cr.decisionUsed = true;
  STATE.careerStats.clutchAttempts = (STATE.careerStats.clutchAttempts||0) + 1;
  if(success) STATE.careerStats.clutchWins = (STATE.careerStats.clutchWins||0) + 1;
  dp.result = {
    shot, success, successRate: Math.round(successRate * 100),
    text: success ? shot.successText : shot.failText
  };
  STATE.step = 'decisionResult';
  render();
  setTimeout(() => {
    if(!STATE.matchState) return;
    STATE.step = 'match';
    STATE.decisionPoint = null;
    simulateRound();
    render();
  }, 1800);
}
function endRound(){
  const ms = STATE.matchState;
  if(!ms || !ms.currentRound) return;
  const cr = ms.currentRound;
  const won = cr.p1Sets > cr.p2Sets;
  const score = cr.sets.map(s=>`${s.p1}-${s.p2}`).join(' ');
  let staminaCost = Math.round(cr.sets.reduce((sum, s)=>sum + 1.2 + Math.abs(s.p1 - s.p2)*0.06, 0) + 2.5);
  if(hasTrait('physical')) staminaCost = Math.round(staminaCost * 0.85);
  ms.results.push({
    round: ms.roundIndex + 1, roundName: ROUND_NAMES[ms.roundIndex],
    opponent: cr.opp.name, country: cr.opp.country, ovr: cr.opp.ovr,
    won, score, sets: cr.sets, staminaCost, decisionUsed: cr.decisionUsed
  });
  ms.staminaCost += staminaCost;
  applyStamina(-staminaCost);
  if(won){
    STATE.currentStreak += 1;
    addMomentum(0.5);
    if(STATE.currentStreak > STATE.bestStreak) STATE.bestStreak = STATE.currentStreak;
  } else {
    STATE.currentStreak = 0;
    addMomentum(-0.5);
  }
  ms.roundIndex++;
  ms.currentRound = null;
  render();
  if(won && ms.roundIndex < 5) setTimeout(advanceRound, 900);
  else setTimeout(finishMatchSimulation, 900);
}
function getPrizeByRound(tier, wins, isMajor, majorType){
  if(isMajor){
    if(majorType === 'olympics') return wins===5 ? 50 : wins===4 ? 20 : 0;
    if(majorType === 'worlds') return wins===5 ? 40 : wins===4 ? 15 : 0;
    if(majorType === 'thomas' || majorType === 'uber' || majorType === 'sudirman') return wins>=4 ? 15 : 0;
    return 0;
  }
  const arr = PRIZE_TABLE[tier] || [0,0,0,0,0,0];
  return arr[wins] || 0;
}
function finishMatchSimulation(){
  const ms = STATE.matchState;
  if(!ms || ms.finished) return;
  ms.finished = true;
  const t = ms.tournament;
  const results = ms.results;
  const wins = results.filter(r=>r.won).length;
  const rounds = 5;
  applyStamina(10);
  const personalChampion = wins === rounds && !ms.isTeam;
  let teamChampion = false;
  if(ms.isTeam){
    if(wins === rounds) teamChampion = true;
    else if(wins === rounds - 1) teamChampion = Math.random() < 0.4;
  }
  let pts = 0;
  if(wins === rounds) pts = t.points;
  else pts = Math.floor(t.points * (0.1 + 0.6 * (wins/rounds)));
  if(teamChampion && wins < rounds) pts = Math.floor(pts * 1.15);
  STATE.seasonStats.gp += results.length;
  STATE.seasonStats.wins += wins;
  STATE.seasonStats.losses += results.length - wins;
  STATE.careerStats.gp += results.length;
  STATE.careerStats.wins += wins;
  STATE.careerStats.losses += results.length - wins;
  const prizeMoney = getPrizeByRound(t.tier, wins, t.isMajor, t.majorType);
  if(prizeMoney > 0){
    STATE.careerStats.careerPrize = (STATE.careerStats.careerPrize||0) + prizeMoney;
    STATE.wallet = (STATE.wallet||0) + prizeMoney;
  }
  if(personalChampion){
    STATE.careerStats.titles++;
    STATE.seasonStats.titles++;
    STATE.wonTournamentNames.push(t.name);
    if(t.tier==='超级1000') STATE.careerStats.super1000++;
    else if(t.tier==='超级750') STATE.careerStats.super750++;
    else if(t.tier==='超级500') STATE.careerStats.super500++;
    else if(t.tier==='超级300') STATE.careerStats.super300++;
    if(t.majorType === 'olympics') STATE.careerStats.olympicGold++;
    if(t.majorType === 'worlds') STATE.careerStats.worldsGold++;
    addNews(`🏆 ${t.name} 夺冠！`,`${STATE.playerName} 在${t.tier}赛事中夺冠！奖金¥${fmtMoney(prizeMoney)}万`,'冠军');
    addMomentum(1);
    STATE.currentStreak += 5;
  } else if(teamChampion){
    STATE.careerStats.titles++;
    STATE.seasonStats.titles++;
    STATE.wonTournamentNames.push(t.name);
    if(t.majorType === 'thomas' || t.majorType === 'uber') STATE.careerStats.thomasUberCup++;
    if(t.majorType === 'sudirman') STATE.careerStats.sudirmanCup++;
    addNews(`🏆 ${t.name} 团体夺冠！`,`${STATE.playerName} 随队夺得${t.name}冠军！个人战绩${wins}胜${rounds-wins}负`,'冠军');
    addMomentum(1);
    STATE.currentStreak += 5;
  } else {
    const roundName = ROUND_NAMES[wins] || '首轮';
    addNews(`📊 ${t.name}`,`${STATE.playerName} 止步${roundName}，奖金¥${fmtMoney(prizeMoney)}万`,'赛事');
    addMomentum(-1);
    STATE.currentStreak = 0;
  }
  if(STATE.currentStreak > STATE.bestStreak) STATE.bestStreak = STATE.currentStreak;
  STATE.rankPoints += pts;
  t.played = true;
  t.result = {
    champion: personalChampion ? STATE.playerName : null,
    teamChampion, personalChampion, isTeam: ms.isTeam,
    majorType: t.majorType || null,
    bestRound: wins, points: pts, prizeMoney,
    matches: results, staminaCost: ms.staminaCost, skipped: false
  };
  updateAIPlayersForTournament(t);
  updateWorldRank();
  checkAchievements();
  STATE.matchLog.unshift({
    tournament:t.name, tier:t.tier,
    result: personalChampion||teamChampion ? '冠军' : ROUND_NAMES[wins]||'首轮',
    points:pts, date:`${STATE.seasonYear}-${pad2(rint(1,12))}`
  });
  STATE.currentTournament = t;
  STATE.step = 'result';
  render();
}
function restAndSkip(){
  const next = getNextTournament();

  next.played = true;

function renderRadar(attrs, size=320){
  const keys = ATTR_KEYS;
  const n = keys.length;
  const cx = size/2, cy = size/2;
  const padding = size * 0.18;
  const R = (size/2 - padding) * 0.85;
  const labelR = R + size * 0.05;
  const angleStep = Math.PI*2 / n;
  const startAngle = -Math.PI/2;
  function pointFor(i, r){
    const a = startAngle + i*angleStep;
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  }
  let gridSvg = '';
  [0.25, 0.5, 0.75, 1.0].forEach(scale=>{
    const pts = keys.map((_,i)=>pointFor(i, R*scale).join(',')).join(' ');
    gridSvg += `<polygon points="${pts}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;
  });
  keys.forEach((_,i)=>{
    const [x,y] = pointFor(i, R);
    gridSvg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
  });
  const dataPts = keys.map((k,i)=>{
    const val = clamp(attrs[k]||50, 0, 99) / 99;
    return pointFor(i, R*val).join(',');
  }).join(' ');
  let labelsSvg = '';
  const fontSize = Math.max(9, Math.round(size * 0.033));
  keys.forEach((k,i)=>{
    const angle = startAngle + i*angleStep;
    const cosA = Math.cos(angle);
    const [x, y] = pointFor(i, labelR);
    let anchor;
    if(cosA > 0.25) anchor = 'start';
    else if(cosA < -0.25) anchor = 'end';
    else anchor = 'middle';
    const val = Math.round(attrs[k]||0);
    labelsSvg += `<text x="${x}" y="${y}" font-size="${fontSize}" text-anchor="${anchor}" dominant-baseline="central" font-weight="600">
      <tspan fill="#64748b">${ATTR_CN[k]}</tspan>
      <tspan fill="#059669" dx="3" font-size="${fontSize+1}" font-weight="800">${val}</tspan>
    </text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;overflow:visible;display:block;margin:0 auto">
    ${gridSvg}
    <polygon points="${dataPts}" fill="rgba(5,150,105,0.22)" stroke="#059669" stroke-width="2" stroke-linejoin="round"/>
    ${keys.map((k,i)=>{
      const val = clamp(attrs[k]||50, 0, 99) / 99;
      const [x,y] = pointFor(i, R*val);
      return `<circle cx="${x}" cy="${y}" r="3" fill="#059669"/>`;
    }).join('')}
    ${labelsSvg}
  </svg>`;
}

  </div>`;
}
function beginBuild(){
  const n = document.getElementById('nameInput')?.value.trim();
  if(n) STATE.playerName = n;
  const cs = document.getElementById('countrySelect');
  if(cs) STATE.country = cs.value;
  STATE.step = 'build';
  STATE.currentAttrIndex = 0;
  STATE.attrs = {technique:50,control:50,mental:50,physical:50,badmintonIQ:50,attack:50,defense:50,speed:50};
  STATE.rerollsLeft = 3;
  render();
}
function renderBuild(){
  const key = ATTR_KEYS[STATE.currentAttrIndex];
  const cnKey = ATTR_CN[key];
  let candidates = HISTORICAL_STARS.filter(s=>s.gender===STATE.gender);
  candidates = shuffle(candidates).slice(0,6);
  if(!candidates.length) candidates = shuffle([...HISTORICAL_STARS]).slice(0,6);
  const progress = (STATE.currentAttrIndex/ATTR_KEYS.length)*100;
  return `<div class="anim-fade">
    <div class="mb-4">
      <div class="flex justify-between items-center mb-2"><h2 class="font-black text-lg">属性抽签</h2><span class="text-xs text-slate-500">${STATE.currentAttrIndex+1}/${ATTR_KEYS.length}</span></div>
      <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 bar" style="width:${progress}%"></div></div>
    </div>
    <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 mb-3 flex items-center gap-2">
      <span class="text-2xl">${ATTR_ICON[key]}</span>
      <div><div class="text-xs text-emerald-700">当前抽签</div><div class="font-black text-emerald-900">${cnKey}</div></div>
    </div>
    <div class="space-y-2">
      ${candidates.map((s,i)=>{
        const val = s.attrs[key] ?? 50;
        const lowered = Math.round(clamp(val*0.78+rint(-1,3),48,80));
        return `<div class="anim-slide flex justify-between items-center p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-emerald-300" style="animation-delay:${i*40}ms">
          <div><div class="font-bold text-sm">${s.name}</div><div class="text-xs text-slate-500 mt-0.5">${s.country} · ${cnKey} <b class="text-emerald-600">${lowered}</b> <span class="text-slate-400">(原${val})</span></div></div>
          <button onclick='pickAttr(${JSON.stringify(s)},"${key}",${lowered})' class="btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg">锁定</button>
        </div>`;
      }).join('')}
    </div>
    <button onclick="rerollBuild()" class="btn w-full mt-3 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold ${STATE.rerollsLeft<=0?'opacity-50':''}">🔄 换一批（剩余 ${STATE.rerollsLeft} 次）</button>
  </div>`;
}
function pickAttr(star,key,val){
  STATE.attrs[key] = val;
  STATE.currentAttrIndex++;
  if(STATE.currentAttrIndex >= ATTR_KEYS.length){
    STATE.finalOVR = calcOVR(STATE.attrs);
    STATE.potential = initPotential(STATE.attrs);
    updateTraits();
    STATE.step = 'reveal';
  }
  render();
}
function rerollBuild(){
  if(STATE.rerollsLeft>0){ STATE.rerollsLeft--; render(); }
  else alert('没有刷新次数了。');
}
function renderReveal(){
  return `<div class="text-center py-6 anim-scale">

}
function startCareer(){
  initAIPlayers(STATE.gender);

function getNextTournament(){ return (STATE.tournaments||[]).find(t=>!t.played); }
function getTierClass(t){
  if(t.majorType === 'olympics') return 'tier-olympics';
  if(t.majorType === 'worlds') return 'tier-worlds';
  if(t.isMajor) return 'tier-major';
  if(t.tier==='超级1000') return 'tier-1000';
  if(t.tier==='超级750') return 'tier-750';
  if(t.tier==='超级500') return 'tier-500';
  return 'tier-300';
}
function getTierLabel(t){ return t.isMajor ? t.tier : t.tier.replace('超级',''); }

        <span class="text-[11px] text-slate-500 font-semibold">🔋 体能</span>

      </div>

        <div class="flex gap-0.5">${[-3,-2,-1,0,1,2,3].map(v=>`<div class="w-4 h-1.5 rounded-full ${v<=STATE.momentum&&STATE.momentum>0?'bg-emerald-500':v>=STATE.momentum&&STATE.momentum<0?'bg-red-400':'bg-slate-200'}"></div>`).join('')}</div>

    ${next && next.isMajor ? `

    ${next ? `

function renderShop(){
  const tab = STATE.shopTab || 'equipment';
  const wallet = STATE.wallet || 0;
  let content = '';
  if(tab === 'equipment'){
    content = EQUIPMENTS.map(eq=>{
      const curLvl = STATE.equipment[eq.id] || 0;
      const isMax = curLvl >= eq.levels.length;
      const next = isMax ? null : eq.levels[curLvl];
      const currentBonus = curLvl > 0 ? eq.levels[curLvl-1].bonus : {};
      const bonusText = Object.keys(currentBonus).map(k=>`${ATTR_ICON[k]}${ATTR_CN[k]}+${currentBonus[k]}`).join(' ');
      const nextBonusText = next ? Object.keys(next.bonus).map(k=>`${ATTR_ICON[k]}${ATTR_CN[k]}+${next.bonus[k]}`).join(' ') : '';
      const canBuy = next && wallet >= next.price;
      return `<div class="shop-card p-3 rounded-xl border-2 ${isMax?'border-amber-300 bg-amber-50/50':'border-slate-200 bg-white'}">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2"><span class="text-2xl">${eq.icon}</span><div><div class="font-black text-sm">${eq.name} ${curLvl>0?`<span class="text-[9px] text-emerald-600">Lv.${curLvl}</span>`:''}</div><div class="text-[10px] text-slate-500">${eq.desc}</div></div></div>
          ${isMax?'<span class="text-[10px] font-bold text-amber-600">已满级</span>':''}
        </div>
        <div class="flex justify-between text-[10px] mb-2"><span class="text-slate-500">当前：${bonusText || '无加成'}</span>${next?`<span class="text-emerald-600 font-bold">升级：${nextBonusText}</span>`:''}</div>
        ${next?`<button onclick="buyEquipment('${eq.id}')" class="btn w-full ${canBuy?'bg-gradient-to-r from-emerald-500 to-teal-500 text-white':'bg-slate-100 text-slate-400'} font-bold py-1.5 rounded-lg text-[11px]">${next.name} · ¥${next.price}万</button>`:''}
      </div>`;
    }).join('');
  } else {
    content = ATTR_KEYS.map(k=>{
      const curLvl = STATE.coaches[k] || 0;
      const isMax = curLvl >= COACH_LEVELS.length;
      const next = isMax ? null : COACH_LEVELS[curLvl];
      const curBonus = curLvl > 0 ? COACH_LEVELS[curLvl-1].bonus : 0;
      const canBuy = next && wallet >= next.price;
      return `<div class="shop-card p-3 rounded-xl border-2 ${isMax?'border-amber-300 bg-amber-50/50':'border-slate-200 bg-white'}">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2"><span class="text-xl">${ATTR_ICON[k]}</span><div><div class="font-black text-sm">${COACH_NAMES[k]} ${curLvl>0?`<span class="text-[9px] text-emerald-600">${COACH_LEVELS[curLvl-1].name}</span>`:''}</div><div class="text-[10px] text-slate-500">训练${ATTR_CN[k]}时额外+${curBonus}</div></div></div>
          ${isMax?'<span class="text-[10px] font-bold text-amber-600">已满级</span>':''}
        </div>
        ${next?`<button onclick="buyCoach('${k}')" class="btn w-full ${canBuy?'bg-gradient-to-r from-indigo-500 to-purple-500 text-white':'bg-slate-100 text-slate-400'} font-bold py-1.5 rounded-lg text-[11px]">${next.name} · 训练+${next.bonus} · ¥${next.price}万</button>`:''}
      </div>`;
    }).join('');
  }
  return `<div class="anim-fade">
    <div class="flex items-center justify-between mb-3"><h2 class="text-xl font-black">🛒 商店</h2><div class="text-sm font-black text-amber-600">¥${fmtMoney(wallet)}万</div></div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <button onclick="switchShopTab('equipment')" class="btn py-2 rounded-xl text-xs font-bold ${tab==='equipment'?'tab-active':'tab-inactive'}">🏸 装备</button>
      <button onclick="switchShopTab('coach')" class="btn py-2 rounded-xl text-xs font-bold ${tab==='coach'?'tab-active':'tab-inactive'}">👨‍🏫 教练</button>
    </div>
    <div class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">${content}</div>
    <button onclick="STATE.step='dashboard';render()" class="btn w-full mt-4 bg-slate-100 hover:bg-slate-200 font-semibold py-3 rounded-xl text-sm">返回主页</button>
  </div>`;
}

function finishSeason(){
  const retired = applyAgeDecay();
  if(retired) return;
  STATE.rankPoints = Math.round(STATE.rankPoints * 0.7);
  aiPlayers.forEach(ai => { ai.points = Math.round(ai.points * 0.7); });
  updateWorldRank();
  addNews(`📅 ${STATE.seasonYear}赛季结束`, `战绩：${STATE.seasonStats.gp}场 ${STATE.seasonStats.wins}胜 ${STATE.seasonStats.losses}负，${STATE.seasonStats.titles||0}冠。最终排名#${STATE.worldRank}`, '赛季总结');
  const tp = getTrainingPoints(STATE.age);
  STATE.trainingState = {pointsLeft: tp, tempAllocated: {}, tempSpent: 0, log: []};
  STATE.step = 'training';
  render();
}
function getAvailableTraining(){
  const ts = STATE.trainingState;
  if(!ts) return 0;
  return ts.pointsLeft - ts.tempSpent;
}
function addTrainPoint(k, amount, cost){
  const ts = STATE.trainingState;
  if(!ts) return;
  if(getAvailableTraining() < cost) return;
  const cur = (STATE.attrs[k]||50) + (ts.tempAllocated[k]||0);
  const cap = STATE.potential[k] || 99;
  if(cur >= cap) return;
  const coachBonus = getCoachBonus(k);
  const totalAdd = amount + coachBonus;
  const actual = Math.min(totalAdd, cap - cur);
  if(actual <= 0) return;
  ts.tempAllocated[k] = (ts.tempAllocated[k]||0) + actual;
  ts.tempSpent += cost;
  render();
}
function breakthrough(k){
  const ts = STATE.trainingState;
  if(!ts) return;
  if(getAvailableTraining() < 3) return;
  if((STATE.potential[k]||99) >= 99){ alert('该属性潜力已达上限99'); return; }
  ts.pointsLeft -= 3;
  const success = Math.random() < 0.5;
  if(success){
    STATE.potential[k] = clamp(STATE.potential[k] + 4, 0, 99);
    ts.log.push({k, success, gain:4});
  } else {
    ts.log.push({k, success, gain:0});
  }
  render();
}
function confirmTraining(){
  const ts = STATE.trainingState;
  if(!ts) return;
  ATTR_KEYS.forEach(k=>{
    const add = ts.tempAllocated[k]||0;
    if(add>0) STATE.attrs[k] = clamp(STATE.attrs[k] + add, 1, STATE.potential[k]);
  });
  STATE.finalOVR = calcOVR(STATE.attrs);
  updateTraits();
  STATE.careerStats.breakthroughs = (STATE.careerStats.breakthroughs||0) + ts.log.filter(l=>l.success).length;
  checkAchievements();
  STATE.trainingState = null;
  nextSeason();
}
function renderTraining(){
  const ts = STATE.trainingState;
  if(!ts){ STATE.step='dashboard'; render(); return; }
  const available = getAvailableTraining();
  const cards = ATTR_KEYS.map(k=>{
    const v = STATE.attrs[k]||50;
    const add = ts.tempAllocated[k]||0;
    const display = v + add;
    const cap = STATE.potential[k]||99;
    const pct = Math.round(display/cap*100);
    const coachBonus = getCoachBonus(k);
    const canAdd1 = available >= 1 && display < cap;
    const canAdd2 = available >= 2 && display < cap;
    const canBreak = available >= 3 && cap < 99;
    const nearCap = display >= cap;
    return `<div class="p-3 rounded-xl border-2 ${nearCap?'border-amber-300 bg-amber-50/50':'border-slate-200 bg-white'}">
      <div class="flex items-center justify-between mb-1.5">
        <div class="flex items-center gap-1.5"><span class="text-base">${ATTR_ICON[k]}</span><b class="text-sm">${ATTR_CN[k]}</b>${coachBonus>0?`<span class="text-[9px] font-bold text-indigo-600 bg-indigo-100 px-1 py-0.5 rounded">👨‍🏫+${coachBonus}</span>`:''}</div>
        <div class="text-right"><span class="font-black text-sm">${display}</span><span class="text-[10px] text-slate-400"> / ${cap}</span></div>
      </div>
      <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mb-2"><div class="h-full bg-gradient-to-r from-emerald-400 to-teal-400 bar rounded-full" style="width:${pct}%"></div></div>
      <div class="grid grid-cols-3 gap-1">
        <button onclick="addTrainPoint('${k}',1,1)" ${canAdd1?'':'disabled'} class="btn text-[10px] font-bold py-1.5 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 disabled:bg-slate-100 disabled:text-slate-300">+${1+coachBonus} <span class="text-[8px]">(1点)</span></button>
        <button onclick="addTrainPoint('${k}',2,2)" ${canAdd2?'':'disabled'} class="btn text-[10px] font-bold py-1.5 rounded-lg bg-teal-100 text-teal-700 hover:bg-teal-200 disabled:bg-slate-100 disabled:text-slate-300">+${2+coachBonus}特训 <span class="text-[8px]">(2点)</span></button>
        <button onclick="breakthrough('${k}')" ${canBreak?'':'disabled'} class="btn text-[10px] font-bold py-1.5 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 disabled:bg-slate-100 disabled:text-slate-300">突破 <span class="text-[8px]">(3点)</span></button>
      </div>
    </div>`;
  }).join('');
  const logHtml = ts.log.length ? `<div class="mt-3 p-2.5 rounded-xl bg-slate-50 border border-slate-200">
    <div class="text-[10px] font-bold text-slate-600 mb-1">突破记录</div>
    ${ts.log.map(l=>`<div class="text-[10px] ${l.success?'text-emerald-600':'text-slate-400'}">${l.success?'✅':'❌'} ${ATTR_CN[l.k]} 突破${l.success?`成功，上限+${l.gain}`:'失败'}</div>`).join('')}
  </div>` : '';
  return `<div class="anim-fade">
    <div class="text-center mb-3"><div class="text-3xl mb-1">🏋️</div><h2 class="text-xl font-black">休赛期训练</h2><p class="text-xs text-slate-500 mt-0.5">${STATE.age}岁 · 训练点 <b class="text-emerald-600 text-lg">${available}</b> / ${ts.pointsLeft}</p></div>
    <div class="p-2.5 rounded-xl bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 mb-3 text-[10px] text-emerald-800 leading-relaxed">💡 <b>+1</b>：消耗1点，属性+1（教练可额外加成）<br>💡 <b>特训</b>：消耗2点，属性+2（教练可额外加成）<br>💡 <b>突破</b>：消耗3点，50%概率使该属性潜力上限+4</div>
    <div class="space-y-1.5 max-h-[45vh] overflow-y-auto pr-1">${cards}</div>
    ${logHtml}
    <button onclick="confirmTraining()" class="btn w-full mt-4 bg-gradient-to-r from-emerald-600 to-teal-500 text-white font-bold py-3 rounded-xl shadow-md shadow-emerald-500/25">✅ 确认训练，进入下一赛季</button>
  </div>`;
}
function nextSeason(){
  STATE.age++;
  STATE.careerSeason++;
  STATE.seasonYear++;
  STATE.seasonStats = {gp:0,wins:0,losses:0,titles:0};
  STATE.tournaments = getSeasonTournaments(STATE.gender, STATE.seasonYear);
  STATE.tournamentIndex = 0;
  STATE.userInjury = {gamesOut:0,name:'',detail:''};
  STATE.seasonEventsTriggered = 0;

  STATE.step = 'dashboard';
  render();
}

function getHistoricalLegacy(){
  const c = STATE.careerStats;
  const titles = c.titles||0, wins = c.wins||0, gp = c.gp||0;
  const winRate = gp>0 ? wins/gp : 0;
  const super1000 = c.super1000||0, weeks = c.weeksAtNo1||0;
  const majorScore = (c.olympicGold||0)*18 + (c.worldsGold||0)*12 + (c.thomasUberCup||0)*9 + (c.sudirmanCup||0)*9;
  const score = titles*2.5 + super1000*1.8 + weeks*0.3 + winRate*30 + majorScore;
  let tier,grade,strengths,evalText;
  if(score>=80 || (c.olympicGold||0)>=2 || titles>=20){
    tier='🏆 羽坛传奇'; grade='历史顶级巨星';
    strengths=[`${titles}冠`,`${c.olympicGold||0}枚奥运金牌`,`${c.worldsGold||0}次世锦赛冠军`,`${weeks}周世界第一`];
    evalText='他是羽毛球历史上最伟大的选手之一，统治了一个时代。';
  } else if(score>=45 || titles>=10 || (c.olympicGold||0)>=1 || (c.worldsGold||0)>=1){
    tier='🌟 世界级巨星'; grade='羽坛名将';
    strengths=[`${titles}冠`,`${c.olympicGold||0}枚奥运金牌`,`${c.worldsGold||0}次世锦赛冠军`,`胜率${Math.round(winRate*100)}%`];
    evalText='他是一位世界级的羽毛球选手，拥有辉煌的职业生涯。';
  } else if(score>=20 || titles>=3 || super1000>=1){
    tier='🏅 国际级选手'; grade='巡回赛冠军级';
    strengths=[`${titles}冠`,`${super1000}个超级1000`,`最高排名#${c.bestRank||STATE.worldRank}`];
    evalText='他是一位出色的国际级选手，在BWF巡回赛中取得了不俗的成就。';
  } else {
    tier='🎯 职业选手'; grade='巡回赛常客';
    strengths=[`${titles}冠`,`胜率${Math.round(winRate*100)}%`];
    evalText='他是一位勤奋的职业选手，在羽毛球赛场上留下了自己的足迹。';
  }
  return {tier,grade,strengths:strengths.join('、')||'稳定的职业生涯',evalText};
}
