  .anim-pulse{animation:pulseSoft 1.5s ease-in-out infinite}
  .anim-flash{animation:scoreFlash .5s ease-out}
  .anim-glow{animation:glowPulse 2s ease-in-out infinite}
  .btn{transition:all .15s ease}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

  .tier-worlds{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}

  .shop-card{transition:all .2s ease}

const shuffle = arr => [...arr].sort(()=>Math.random()-0.5);
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const pad2 = n => String(n).padStart(2,'0');
const fmtMoney = n => n >= 100 ? Math.round(n) : (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,'');

function calcOVR(attrs){
  const vals = ATTR_KEYS.map(k => clamp(attrs[k]||50,1,99)).sort((a,b)=>b-a);
  const w = vals[0]*.28 + vals[1]*.22 + vals[2]*.18 + vals[3]*.14 + vals[4]*.08 + vals[5]*.05 + vals[6]*.05;
  return clamp(Math.round(w*1.12+4),60,99);
}

function getSeasonTournaments(gender, year){
  const regular = shuffle([...TOURNAMENTS]).slice(0,16).map((t,i)=>({...t, played:false, result:null, isMajor:false}));
  const majors = [];
  if(year % 4 === 0){
    majors.push({...MAJOR_EVENTS.olympics, played:false, result:null, isMajor:true});
  } else {
    majors.push({...MAJOR_EVENTS.worlds, played:false, result:null, isMajor:true});
  }
  if(year % 2 === 0){
    const cup = gender === '男' ? MAJOR_EVENTS.thomas : MAJOR_EVENTS.uber;
    majors.push({...cup, played:false, result:null, isMajor:true});
  } else {
    majors.push({...MAJOR_EVENTS.sudirman, played:false, result:null, isMajor:true});
  }
  const all = [...regular];
  majors.forEach((m, idx) => {
    const pos = majors.length === 1 ? 8 : (idx === 0 ? 5 : 13);
    all.splice(pos, 0, m);
  });
  return all.map((t,i)=>({...t, id:i}));
}

/* ============ 潜力与训练 ============ */
function initPotential(attrs){
  const pot = {};
  ATTR_KEYS.forEach(k=>{
    pot[k] = clamp((attrs[k]||50) + 15 + rint(0,12), attrs[k]||50, 99);
  });
  return pot;
}

function getTrainingPoints(age){
  if(age<=21) return 6;
  if(age<=24) return 5;
  if(age<=27) return 4;
  if(age<=29) return 3;
  return 2;
}

function updateTraits(){
  STATE.traits = [];
  const eff = getEffectiveAttrs();
  ATTR_KEYS.forEach(k=>{
    const v = eff[k]||0;
    if(v >= 92) STATE.traits.push(k+'_2');
    else if(v >= 85) STATE.traits.push(k+'_1');
  });
}

function hasTrait(key){
  return (STATE.traits||[]).some(t => t === key+'_1' || t === key+'_2');
}

/* ============ 装备与教练 ============ */
function getEffectiveAttrs(){
  const eff = {...STATE.attrs};
  if(STATE.equipment){
    EQUIPMENTS.forEach(eq=>{
      const lvl = STATE.equipment[eq.id] || 0;
      if(lvl > 0){
        const bonus = eq.levels[lvl-1].bonus;
        Object.keys(bonus).forEach(k=>{
          eff[k] = clamp((eff[k]||50) + bonus[k], 0, 99);
        });
      }
    });
  }
  return eff;
}

function getEffectiveOVR(){
  return calcOVR(getEffectiveAttrs());
}

function getCoachBonus(k){
  const lvl = (STATE.coaches && STATE.coaches[k]) || 0;
  return lvl > 0 ? COACH_LEVELS[lvl-1].bonus : 0;
}

function getPrizeByRound(tier, wins, isMajor, majorType){
  if(isMajor){
    if(majorType === 'olympics') return wins===5 ? 50 : wins===4 ? 20 : 0;
    if(majorType === 'worlds') return wins===5 ? 40 : wins===4 ? 15 : 0;
    if(majorType === 'thomas' || majorType === 'uber' || majorType === 'sudirman') return wins>=4 ? 15 : 0;
    return 0;
  }
  const arr = PRIZE_TABLE[tier] || [0,0,0,0,0,0];
  return arr[wins] || 0;
}

let aiPlayers = [];
function initAIPlayers(gender){
  const pool = gender === '男' ? MALE_PLAYERS : FEMALE_PLAYERS;
  aiPlayers = shuffle([...pool]).slice(0,20).map(p=>({
    name:p.name, country:p.country, gender,
    ovr: p.ovr || 80,
    points: 0
  }));
}

function simulateAIPerformance(ai, tournament){
  const strength = ai.ovr/100;
  let won = 0;
  for(let r=0;r<5;r++){
    const p = strength * (0.95 - r*0.06);
    if(Math.random() < p) won++; else break;
  }
  if(won === 5) return tournament.points;
  const ratio = 0.1 + 0.6 * (won/5);
  return Math.floor(tournament.points * ratio);
}

function updateAIPlayersForTournament(t){
  if(!t) return;
  aiPlayers.forEach(ai => { ai.points += simulateAIPerformance(ai, t); });
}

function triggerRandomEvent(){
  if(STATE.seasonEventsTriggered >= 5) return;
  const events = [
    {type:'injury',title:'轻微伤病',detail:'训练中扭伤',minOut:1,maxOut:2},
    {type:'positive',title:'状态爆发',detail:'技术全面提升',positive:true,amount:1},

  ];
  const ev = pick(events);
  const display = {target:STATE.playerName,title:ev.title,detail:ev.detail,impact:''};
  if(ev.positive){
    const key = pick(ATTR_KEYS);
    const cap = STATE.potential[key] || 99;
    STATE.attrs[key] = clamp(STATE.attrs[key]+ev.amount, 1, cap);
    STATE.finalOVR = calcOVR(STATE.attrs);
    updateTraits();
    display.impact = `${ATTR_CN[key]}+${ev.amount}`;
    addNews(`✨ ${STATE.playerName}：${ev.title}`,`${ev.detail}。${display.impact}`,'成长');
  } else if(ev.type === 'injury'){
    const out = rint(ev.minOut,ev.maxOut);
    STATE.userInjury = {gamesOut:out,name:ev.title,detail:ev.detail};
    display.impact = `休战${out}场`;
    addNews(`🚑 ${STATE.playerName}：${ev.title}`,`${ev.detail}。${display.impact}`,'伤病');
  } else {
    display.impact = '无重大影响';
    addNews(`📰 ${STATE.playerName}：${ev.title}`,ev.detail,'花絮');
  }
  STATE.seasonEventsTriggered++;
  STATE.eventHistory.unshift(display);
  if(STATE.eventHistory.length>100) STATE.eventHistory.length=100;
}

/* ================= 年龄衰减 ================= */
function applyAgeDecay(){
  const age = STATE.age;
  if(age >= 30){
    let drop = age<=32?1:age<=34?2:3;
    const keys = shuffle([...ATTR_KEYS]);
    let totalDrop = drop;
    for(const k of keys){
      if(totalDrop<=0) break;
      if(STATE.attrs[k]>40){
        const d = Math.min(totalDrop,2);
        STATE.attrs[k] = clamp(STATE.attrs[k]-d,35,99);
        totalDrop -= d;
      }
    }
    STATE.finalOVR = calcOVR(STATE.attrs);
    updateTraits();
    addNews(`📉 年龄影响`,`${STATE.playerName} 已${age}岁，身体机能下降，OVR降至${getEffectiveOVR()}`,'衰减');
    if(age >= 35){
      addNews(`🛑 强制退役`,`${STATE.playerName} 年满35岁，自动退役`,'退役');
      STATE.step = 'retired';
      render();
      return true;
    }
  }
  return false;
}

/* ================= 比赛模拟核心 ================= */
function calcBaseWinProb(player, opp, userMod){
  const ovr1 = player.ovr||75, ovr2 = opp.ovr||75;
  const a1 = player.attrs, a2 = opp.attrs;
  const bonus1 = (a1.speed||50)*.0015 + (a1.power||50)*.0015 + (a1.technique||50)*.002 + (a1.mental||50)*.001;
  const bonus2 = (a2.speed||50)*.0015 + (a2.power||50)*.0015 + (a2.technique||50)*.002 + (a2.mental||50)*.001;
  let s1 = (ovr1/100*.6 + bonus1*.4) * userMod;
  let s2 = (ovr2/100*.6 + bonus2*.4);
  return clamp(s1/(s1+s2), 0.05, 0.95);
}

function generateOpponent(round, tier, gender){
  const tierBonus = tier==='超级1000'?8 : tier==='超级750'?6 : tier==='超级500'?4 : 2;
  const base = 62 + round*2.5 + tierBonus;
  const ovr = clamp(base + rint(-4,6), 55, 96);
  const player = getOpponent(gender);
  const scale = (ovr - 55) / 41;
  return {
    name:player.name, country:player.country, ovr,
    attrs:{
      speed:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99),
      power:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99),
      stamina:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99),
      technique:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99),
      mental:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99),
      agility:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99),
      reflex:clamp(Math.round(40 + scale*55 + rint(-8,8)),30,99)
    },
    isUser:false
  };
}

function generateMajorOpponent(round, gender){
  const base = 86 + round*2;
  const ovr = clamp(base + rint(-3,6), 82, 99);
  const player = getOpponent(gender);
  const scale = (ovr - 70) / 27;
  return {
    name:player.name, country:player.country, ovr,
    attrs:{
      speed:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99),
      power:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99),
      stamina:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99),
      technique:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99),
      mental:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99),
      agility:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99),
      reflex:clamp(Math.round(65 + scale*30 + rint(-6,6)),50,99)
    },
    isUser:false
  };
}

function isSetOver(cs){
  if(cs.p1 >= 21 && cs.p1 - cs.p2 >= 2) return true;
  if(cs.p2 >= 21 && cs.p2 - cs.p1 >= 2) return true;
  return false;
}

function shouldTriggerDecision(cs){
  const p1 = cs.p1, p2 = cs.p2;
  if(p1 < 16 && p2 < 16) return false;
  if(Math.abs(p1 - p2) > 4) return false;
  if(p1 >= 20 || p2 >= 20) return true;
  if(p1 >= 19 && p2 >= 19) return true;
  if(p1 >= 18 && p2 >= 18) return true;
  return false;
}

function calcShotSuccess(shot, playerAttrs, oppAttrs){
  const pVal = (playerAttrs[shot.primary]||50) * 0.55 + (playerAttrs[shot.secondary]||50) * 0.45;
  const oVal = (oppAttrs[shot.counter]||50);
  let rate = shot.baseRate;
  rate += (pVal - 55) / 100 * 0.35;
  rate -= (oVal - 55) / 100 * 0.25;
  rate += ((playerAttrs.mental||50) - 50) / 200;
  rate += STATE.momentum * 0.02;
  rate -= (100 - STATE.stamina) / 100 * 0.10;

  if(hasTrait('technique')) rate += 0.02;
  if(hasTrait('mental')) rate += 0.03;
  if(hasTrait('speed')) rate += 0.03;
  const shotTraits = SHOT_TRAIT_MAP[shot.id] || [];
  shotTraits.forEach(t => { if(hasTrait(t)) rate += 0.04; });

  return clamp(rate, 0.15, 0.90);
}

/* ================= 比赛流程 ================= */
function playNextTournament(){
  const next = getNextTournament();
  if(!next){ finishSeason(); return; }

  if(STATE.userInjury && STATE.userInjury.gamesOut>0){
    STATE.userInjury.gamesOut--;
    addNews(`📌 伤病休战`,`${STATE.playerName} 因${STATE.userInjury.name}，缺席${next.name}`,'伤病');
    next.played = true;
    next.result = {champion:null,bestRound:0,points:0,matches:[],skipped:true};
    updateAIPlayersForTournament(next);
    applyStamina(30);
    updateWorldRank();
    render();
    return;
  }

  if(Math.random() < 0.15) triggerRandomEvent();

  STATE.matchState = {
    tournament: next,
    roundIndex: 0,
    results: [],
    staminaCost: 0,
    isMajor: next.isMajor || false,
    isTeam: next.isTeam || false,
    currentRound: null,
    finished: false
  };
  STATE.decisionPoint = null;
  STATE.step = 'match';
  render();
  setTimeout(advanceRound, 350);
}

function advanceRound(){
  const ms = STATE.matchState;
  if(!ms || ms.finished) return;
  if(ms.roundIndex >= 5){
    finishMatchSimulation();
    return;
  }

  const isMajor = ms.isMajor;
  const opp = isMajor
    ? generateMajorOpponent(ms.roundIndex, STATE.gender)
    : generateOpponent(ms.roundIndex, ms.tournament.tier, STATE.gender);

  const userMod = getStaminaModifier() * getMomentumModifier();
  const effAttrs = getEffectiveAttrs();
  const player = {name: STATE.playerName, ovr: getEffectiveOVR(), attrs: effAttrs, isUser: true};
  const baseWinProb = calcBaseWinProb(player, opp, userMod);

  ms.currentRound = {
    opp,
    player,
    sets: [],
    p1Sets: 0,
    p2Sets: 0,
    currentSet: {p1: 0, p2: 0},
    decisionUsed: false,
    p1Win: baseWinProb,
    userMod
  };

  render();
  simulateRound();
}

function simulateRound(){
  const ms = STATE.matchState;
  if(!ms || !ms.currentRound) return;
  const cr = ms.currentRound;

  let safety = 0;
  while(cr.p1Sets < 2 && cr.p2Sets < 2 && safety < 400){
    safety++;
    const cs = cr.currentSet;

    if(isSetOver(cs)){
      cr.sets.push({p1: cs.p1, p2: cs.p2});
      if(cs.p1 > cs.p2) cr.p1Sets++;
      else cr.p2Sets++;
      cr.currentSet = {p1: 0, p2: 0};
      continue;
    }

    if(!cr.decisionUsed && shouldTriggerDecision(cs)){
      setupDecision();
      return;
    }

    const pointWinProb = clamp(cr.p1Win * (0.88 + Math.random()*0.24), 0.05, 0.95);
    if(Math.random() < pointWinProb) cs.p1++;
    else cs.p2++;
  }

  if(cr.p1Sets >= 2 || cr.p2Sets >= 2){
    endRound();
  }
}

function setupDecision(){
  const ms = STATE.matchState;
  const cr = ms.currentRound;
  const cs = cr.currentSet;

  let context = '关键分';
  if(cs.p1 >= 20 || cs.p2 >= 20){
    if(cs.p1 >= 20 && cs.p1 >= cs.p2) context = '局点';
    else if(cs.p2 >= 20) context = '对手局点';
    if(cr.p1Sets === 1 && cr.p2Sets === 1 && context === '局点') context = '赛点';
    else if(cr.p1Sets === 1 && context === '局点') context = '赛点';
  } else if(cs.p1 >= 19 && cs.p2 >= 19){
    context = '平分';
  }

  const options = shuffle([...SHOTS]).slice(0, 3);

  STATE.decisionPoint = {
    context,
    score: {p1: cs.p1, p2: cs.p2},
    options
  };
  STATE.step = 'decision';
  render();
}

function resolveDecision(shotId){
  const ms = STATE.matchState;
  const dp = STATE.decisionPoint;
  if(!ms || !ms.currentRound || !dp) return;
  const cr = ms.currentRound;
  const shot = SHOTS.find(s => s.id === shotId);
  if(!shot) return;

  const successRate = calcShotSuccess(shot, cr.player.attrs, cr.opp.attrs);
  const success = Math.random() < successRate;

  if(success) cr.currentSet.p1++;
  else cr.currentSet.p2++;

  cr.decisionUsed = true;
  STATE.careerStats.clutchAttempts = (STATE.careerStats.clutchAttempts||0) + 1;
  if(success) STATE.careerStats.clutchWins = (STATE.careerStats.clutchWins||0) + 1;

  dp.result = {
    shot,
    success,
    successRate: Math.round(successRate * 100),
    text: success ? shot.successText : shot.failText
  };

  STATE.step = 'decisionResult';
  render();

  setTimeout(() => {
    if(!STATE.matchState) return;
    STATE.step = 'match';
    STATE.decisionPoint = null;
    simulateRound();
    render();
  }, 1800);
}

function endRound(){
  const ms = STATE.matchState;
  if(!ms || !ms.currentRound) return;
  const cr = ms.currentRound;

  const won = cr.p1Sets > cr.p2Sets;
  const score = cr.sets.map(s=>`${s.p1}-${s.p2}`).join(' ');

  let staminaCost = Math.round(cr.sets.reduce((sum, s)=>sum + 1.2 + Math.abs(s.p1 - s.p2)*0.06, 0) + 2.5);
  if(hasTrait('stamina')) staminaCost = Math.round(staminaCost * 0.85);

  ms.results.push({
    round: ms.roundIndex + 1,
    roundName: ROUND_NAMES[ms.roundIndex],
    opponent: cr.opp.name,
    country: cr.opp.country,
    ovr: cr.opp.ovr,
    won,
    score,
    sets: cr.sets,
    staminaCost,
    decisionUsed: cr.decisionUsed
  });

  ms.staminaCost += staminaCost;
  applyStamina(-staminaCost);

  if(won){
    STATE.currentStreak += 1;
    addMomentum(0.5);
    if(STATE.currentStreak > STATE.bestStreak) STATE.bestStreak = STATE.currentStreak;
  } else {
    STATE.currentStreak = 0;
    addMomentum(-0.5);
  }

  ms.roundIndex++;
  ms.currentRound = null;
  render();

  if(won && ms.roundIndex < 5){
    setTimeout(advanceRound, 900);
  } else {
    setTimeout(finishMatchSimulation, 900);
  }
}

function finishMatchSimulation(){
  const ms = STATE.matchState;
  if(!ms || ms.finished) return;
  ms.finished = true;

  const t = ms.tournament;
  const results = ms.results;
  const wins = results.filter(r=>r.won).length;
  const rounds = 5;

  applyStamina(10);

  const personalChampion = wins === rounds && !ms.isTeam;
  let teamChampion = false;
  if(ms.isTeam){
    if(wins === rounds) teamChampion = true;
    else if(wins === rounds - 1) teamChampion = Math.random() < 0.4;
  }

  let pts = 0;
  if(wins === rounds) pts = t.points;
  else pts = Math.floor(t.points * (0.1 + 0.6 * (wins/rounds)));
  if(teamChampion && wins < rounds) pts = Math.floor(pts * 1.15);

  STATE.seasonStats.gp += results.length;
  STATE.seasonStats.wins += wins;
  STATE.seasonStats.losses += results.length - wins;
  STATE.careerStats.gp += results.length;
  STATE.careerStats.wins += wins;
  STATE.careerStats.losses += results.length - wins;

  // 奖金
  const prizeMoney = getPrizeByRound(t.tier, wins, t.isMajor, t.majorType);
  if(prizeMoney > 0){
    STATE.careerStats.careerPrize = (STATE.careerStats.careerPrize||0) + prizeMoney;
    STATE.wallet = (STATE.wallet||0) + prizeMoney;
  }

  if(personalChampion){
    STATE.careerStats.titles++;
    STATE.seasonStats.titles++;
    STATE.wonTournamentNames.push(t.name);
    if(t.tier==='超级1000') STATE.careerStats.super1000++;
    else if(t.tier==='超级750') STATE.careerStats.super750++;
    else if(t.tier==='超级500') STATE.careerStats.super500++;
    else if(t.tier==='超级300') STATE.careerStats.super300++;
    if(t.majorType === 'olympics') STATE.careerStats.olympicGold++;
    if(t.majorType === 'worlds') STATE.careerStats.worldsGold++;
    addNews(`🏆 ${t.name} 夺冠！`,`${STATE.playerName} 在${t.tier}赛事中夺冠！奖金¥${fmtMoney(prizeMoney)}万`,'冠军');
    addMomentum(1);
    STATE.currentStreak += 5;
  } else if(teamChampion){
    STATE.careerStats.titles++;
    STATE.seasonStats.titles++;
    STATE.wonTournamentNames.push(t.name);
    if(t.majorType === 'thomas' || t.majorType === 'uber') STATE.careerStats.thomasUberCup++;
    if(t.majorType === 'sudirman') STATE.careerStats.sudirmanCup++;
    addNews(`🏆 ${t.name} 团体夺冠！`,`${STATE.playerName} 随队夺得${t.name}冠军！个人战绩${wins}胜${rounds-wins}负`,'冠军');
    addMomentum(1);
    STATE.currentStreak += 5;
  } else {
    const roundName = ROUND_NAMES[wins] || '首轮';
    addNews(`📊 ${t.name}`,`${STATE.playerName} 止步${roundName}，奖金¥${fmtMoney(prizeMoney)}万`,'赛事');
    addMomentum(-1);
    STATE.currentStreak = 0;
  }
  if(STATE.currentStreak > STATE.bestStreak) STATE.bestStreak = STATE.currentStreak;

  STATE.rankPoints += pts;
  t.played = true;
  t.result = {
    champion: personalChampion ? STATE.playerName : null,
    teamChampion,
    personalChampion,
    isTeam: ms.isTeam,
    majorType: t.majorType || null,
    bestRound: wins,
    points: pts,
    prizeMoney,
    matches: results,
    staminaCost: ms.staminaCost,
    skipped: false
  };

  updateAIPlayersForTournament(t);
  updateWorldRank();
  checkAchievements();

  STATE.matchLog.unshift({
    tournament:t.name, tier:t.tier,
    result: personalChampion||teamChampion ? '冠军' : ROUND_NAMES[wins]||'首轮',
    points:pts, date:`${STATE.seasonYear}-${pad2(rint(1,12))}`
  });

  STATE.currentTournament = t;
  STATE.step = 'result';
  render();
}

function restAndSkip(){
  const next = getNextTournament();
  if(!next) return;
  next.played = true;
  next.result = {champion:null,teamChampion:false,personalChampion:false,bestRound:0,points:0,matches:[],skipped:true};
  updateAIPlayersForTournament(next);
  applyStamina(70);
  addMomentum(0);
  STATE.currentStreak = 0;
  updateWorldRank();
  addNews(`😴 休整恢复`,`${STATE.playerName} 跳过${next.name}，全力恢复体能`,'休整');
  render();
}

/* ================= 商店 ================= */
function renderShop(){
  const tab = STATE.shopTab || 'equipment';
  const wallet = STATE.wallet || 0;

  let content = '';
  if(tab === 'equipment'){
    content = EQUIPMENTS.map(eq=>{
      const curLvl = STATE.equipment[eq.id] || 0;
      const isMax = curLvl >= eq.levels.length;
      const next = isMax ? null : eq.levels[curLvl];
      const currentBonus = curLvl > 0 ? eq.levels[curLvl-1].bonus : {};
      const bonusText = Object.keys(currentBonus).map(k=>`${ATTR_ICON[k]}${ATTR_CN[k]}+${currentBonus[k]}`).join(' ');
      const nextBonusText = next ? Object.keys(next.bonus).map(k=>`${ATTR_ICON[k]}${ATTR_CN[k]}+${next.bonus[k]}`).join(' ') : '';
      const canBuy = next && wallet >= next.price;

      return `<div class="shop-card p-3 rounded-xl border-2 ${isMax?'border-amber-300 bg-amber-50/50':'border-slate-200 bg-white'}">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-2xl">${eq.icon}</span>
            <div>
              <div class="font-black text-sm">${eq.name} ${curLvl>0?`<span class="text-[9px] text-emerald-600">Lv.${curLvl}</span>`:''}</div>
              <div class="text-[10px] text-slate-500">${eq.desc}</div>
            </div>
          </div>
          ${isMax?'<span class="text-[10px] font-bold text-amber-600">已满级</span>':''}
        </div>
        <div class="flex justify-between text-[10px] mb-2">
          <span class="text-slate-500">当前：${bonusText || '无加成'}</span>
          ${next?`<span class="text-emerald-600 font-bold">升级：${nextBonusText}</span>`:''}
        </div>
        ${next?`<button onclick="buyEquipment('${eq.id}')" class="btn w-full ${canBuy?'bg-gradient-to-r from-emerald-500 to-teal-500 text-white':'bg-slate-100 text-slate-400'} font-bold py-1.5 rounded-lg text-[11px]">${next.name} · ¥${next.price}万</button>`:''}
      </div>`;
    }).join('');
  } else {
    content = ATTR_KEYS.map(k=>{
      const curLvl = STATE.coaches[k] || 0;
      const isMax = curLvl >= COACH_LEVELS.length;
      const next = isMax ? null : COACH_LEVELS[curLvl];
      const curBonus = curLvl > 0 ? COACH_LEVELS[curLvl-1].bonus : 0;
      const canBuy = next && wallet >= next.price;
      return `<div class="shop-card p-3 rounded-xl border-2 ${isMax?'border-amber-300 bg-amber-50/50':'border-slate-200 bg-white'}">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-xl">${ATTR_ICON[k]}</span>
            <div>
              <div class="font-black text-sm">${COACH_NAMES[k]} ${curLvl>0?`<span class="text-[9px] text-emerald-600">${COACH_LEVELS[curLvl-1].name}</span>`:''}</div>
              <div class="text-[10px] text-slate-500">训练${ATTR_CN[k]}时额外+${curBonus}</div>
            </div>
          </div>
          ${isMax?'<span class="text-[10px] font-bold text-amber-600">已满级</span>':''}
        </div>
        ${next?`<button onclick="buyCoach('${k}')" class="btn w-full ${canBuy?'bg-gradient-to-r from-indigo-500 to-purple-500 text-white':'bg-slate-100 text-slate-400'} font-bold py-1.5 rounded-lg text-[11px]">${next.name} · 训练额外+${next.bonus} · ¥${next.price}万</button>`:''}
      </div>`;
    }).join('');
  }

  return `<div class="anim-fade">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-xl font-black">🛒 商店</h2>
      <div class="text-sm font-black text-amber-600">¥${fmtMoney(wallet)}万</div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <button onclick="switchShopTab('equipment')" class="btn py-2 rounded-xl text-xs font-bold ${tab==='equipment'?'tab-active':'tab-inactive'}">🏸 装备</button>
      <button onclick="switchShopTab('coach')" class="btn py-2 rounded-xl text-xs font-bold ${tab==='coach'?'tab-active':'tab-inactive'}">👨‍🏫 教练</button>
    </div>

    <div class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">${content}</div>

    <button onclick="STATE.step='dashboard';render()" class="btn w-full mt-4 bg-slate-100 hover:bg-slate-200 font-semibold py-3 rounded-xl text-sm">返回主页</button>
  </div>`;
}

/* ================= 比赛界面 ================= */
function renderMatch(){
  const ms = STATE.matchState;
  if(!ms){ STATE.step = 'dashboard'; render(); return; }
  const t = ms.tournament;
  const cr = ms.currentRound;
  const results = ms.results;
  const totalRounds = 5;
  const progress = (results.length / totalRounds) * 100;

  const resultsHtml = results.map(r=>`
    <div class="anim-pop p-2.5 rounded-xl border-2 ${r.won?'border-emerald-300 bg-emerald-50':'border-red-300 bg-red-50'} flex justify-between items-center">
      <div class="min-w-0">
        <div class="text-[10px] text-slate-500">${r.roundName}</div>
        <div class="text-sm font-bold truncate">${r.opponent} <span class="text-[10px] text-slate-500 font-normal">${r.country} · ${r.ovr}</span></div>
      </div>
      <div class="text-right shrink-0 ml-2">
        <div class="text-[10px] font-bold ${r.won?'text-emerald-600':'text-red-600'}">${r.won?'✅ 胜':'❌ 负'}</div>
        <div class="text-[11px] font-mono">${r.score}</div>
      </div>
    </div>
  `).join('');

  return `<div class="anim-fade">
    <div class="text-center mb-3">
      <div class="text-[11px] text-slate-500">${t.tier} · ${t.city}</div>
      <h2 class="text-xl font-black mt-0.5">${t.isMajor?t.icon+' ':''}${t.name}</h2>
      ${t.isTeam?'<div class="text-[10px] text-amber-600 font-bold mt-0.5">团体赛 · 五场三胜</div>':''}
    </div>

    <div class="mb-3">
      <div class="flex justify-between text-[10px] text-slate-500 mb-1">
        <span>比赛进度</span>
        <span>第 ${Math.min(results.length+1, totalRounds)}/${totalRounds} 轮</span>
      </div>
      <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 bar rounded-full" style="width:${progress}%"></div>
      </div>
    </div>

    ${cr ? `
    <div class="p-3 rounded-2xl bg-gradient-to-br from-slate-50 to-white border-2 border-emerald-200 mb-3 anim-scale">
      <div class="flex items-center justify-between mb-2">
        <div class="text-[10px] font-bold text-emerald-700">🔥 当前对手</div>
        <div class="text-[10px] text-slate-500">${ROUND_NAMES[ms.roundIndex]}</div>
      </div>
      <div class="flex items-center justify-between">
        <div class="min-w-0">
          <div class="font-black text-base truncate">${cr.opp.name}</div>
          <div class="text-[11px] text-slate-500">${cr.opp.country} · OVR ${cr.opp.ovr}</div>
        </div>
        <div class="text-right shrink-0 ml-2">
          <div class="text-[10px] text-slate-500">大比分</div>
          <div class="font-black text-lg">${cr.p1Sets} : ${cr.p2Sets}</div>
        </div>
      </div>
      <div class="mt-2 p-2 rounded-xl bg-white border border-slate-200 text-center">
        <div class="text-[10px] text-slate-500">当前局</div>
        <div class="font-mono font-black text-xl">
          <span class="${cr.currentSet.p1>cr.currentSet.p2?'text-emerald-600':'text-slate-700'}">${cr.currentSet.p1}</span>
          <span class="text-slate-400 mx-1">-</span>
          <span class="${cr.currentSet.p2>cr.currentSet.p1?'text-red-600':'text-slate-700'}">${cr.currentSet.p2}</span>
        </div>
      </div>
    </div>` : `
    <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-center mb-3">
      <div class="text-xs text-slate-500 anim-pulse">⏳ 结算中...</div>
    </div>`}

    <div class="space-y-1.5">
      ${resultsHtml}
    </div>

    ${!results.length && !cr ? `<div class="text-center py-8 text-xs text-slate-500 anim-pulse">⏳ 比赛即将开始...</div>` : ''}
    ${!results.length && cr && !STATE.decisionPoint ? `<div class="text-center py-4 text-xs text-slate-500 anim-pulse">⏳ 对阵中...</div>` : ''}
  </div>`;
}

/* ================= 关键球决策 ================= */
function renderDecision(){
  const dp = STATE.decisionPoint;
  const ms = STATE.matchState;
  if(!dp || !ms || !ms.currentRound){ STATE.step = 'match'; render(); return; }
  const cr = ms.currentRound;
  const cs = cr.currentSet;

  const contextColor = dp.context.includes('赛点') ? 'from-red-500 to-orange-500'
    : dp.context.includes('对手') ? 'from-slate-600 to-slate-700'
    : dp.context.includes('局点') ? 'from-amber-500 to-orange-500'
    : 'from-emerald-500 to-teal-500';

  const optionsHtml = dp.options.map((shot,i)=>{
    const rate = Math.round(calcShotSuccess(shot, cr.player.attrs, cr.opp.attrs) * 100);
    const rateColor = rate >= 65 ? 'text-emerald-600' : rate >= 50 ? 'text-amber-600' : 'text-red-600';
    const barColor = rate >= 65 ? 'bg-emerald-500' : rate >= 50 ? 'bg-amber-500' : 'bg-red-500';
    const shotTraits = SHOT_TRAIT_MAP[shot.id] || [];
    const hasBonus = shotTraits.some(t=>hasTrait(t));
    return `<div onclick="resolveDecision('${shot.id}')" class="shot-card anim-pop p-3 rounded-xl border-2 ${hasBonus?'border-amber-300 bg-amber-50/40':'border-slate-200 bg-white'}" style="animation-delay:${i*60}ms">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="text-2xl">${shot.icon}</span>
          <div>
            <div class="font-black text-sm">${shot.name}${hasBonus?' <span class="text-[9px] text-amber-600">✨特长加成</span>':''}</div>
            <div class="text-[10px] text-slate-500">${shot.desc}</div>
          </div>
        </div>
        <div class="text-right">
          <div class="text-lg font-black ${rateColor}">${rate}%</div>
          <div class="text-[9px] ${shot.riskColor} font-bold">风险${shot.risk}</div>
        </div>
      </div>
      <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mb-2">
        <div class="h-full ${barColor}" style="width:${rate}%"></div>
      </div>
      <div class="flex gap-1.5">
        <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${ATTR_ICON[shot.primary]}${ATTR_CN[shot.primary]}</span>
        <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${ATTR_ICON[shot.secondary]}${ATTR_CN[shot.secondary]}</span>
        <span class="text-[9px] px-1.5 py-0.5 rounded bg-red-50 text-red-500 ml-auto">被${ATTR_CN[shot.counter]}克制</span>
      </div>
    </div>`;
  }).join('');

  return `<div class="anim-fade">
    <div class="text-center mb-3">
      <div class="inline-block px-3 py-1 rounded-full bg-gradient-to-r ${contextColor} text-white text-[10px] font-black tracking-widest mb-2 anim-pulse">
        ⚡ ${dp.context}
      </div>
      <div class="text-[11px] text-slate-500">${ROUND_NAMES[ms.roundIndex]} vs ${cr.opp.name}</div>
    </div>

    <div class="p-4 rounded-2xl bg-gradient-to-br from-slate-900 to-slate-700 text-white mb-4 anim-scale">
      <div class="flex justify-between items-center">
        <div class="text-center flex-1">
          <div class="text-[10px] text-slate-300">你</div>
          <div class="text-3xl font-black">${cs.p1}</div>
        </div>
        <div class="text-slate-500 text-xs">局分 ${cr.p1Sets}-${cr.p2Sets}</div>
        <div class="text-center flex-1">
          <div class="text-[10px] text-slate-300">${cr.opp.name}</div>
          <div class="text-3xl font-black">${cs.p2}</div>
        </div>
      </div>
    </div>

    <div class="text-center text-xs text-slate-600 mb-2 font-bold">选择你的出手方式</div>
    <div class="space-y-2">${optionsHtml}</div>

    <div class="mt-3 text-center text-[10px] text-slate-400">
      成功率受属性、对手克制、体能、势头、心理与特长影响
    </div>
  </div>`;
}

function renderDecisionResult(){
  const dp = STATE.decisionPoint;
  if(!dp || !dp.result){ STATE.step = 'match'; render(); return; }
  const r = dp.result;
  const ms = STATE.matchState;
  const cr = ms?.currentRound;
  const cs = cr?.currentSet;

  const emoji = r.success ? '🎉' : '😖';
  const title = r.success ? '得分！' : '失分';
  const color = r.success ? 'from-emerald-500 to-teal-500' : 'from-red-500 to-rose-500';

  return `<div class="anim-scale text-center py-4">
    <div class="inline-block px-3 py-1 rounded-full bg-gradient-to-r ${color} text-white text-[10px] font-black tracking-widest mb-3">
      ${r.shot.icon} ${r.shot.name} · 成功率${r.successRate}%
    </div>
    <div class="text-6xl mb-3 anim-pop">${emoji}</div>
    <h2 class="text-2xl font-black mb-2 ${r.success?'text-emerald-600':'text-red-600'}">${title}</h2>
    <p class="text-sm text-slate-700 px-4 leading-relaxed">${r.text}</p>
    ${cs ? `
    <div class="mt-4 inline-flex items-center gap-3 px-5 py-2 rounded-xl bg-slate-100 border border-slate-200">
      <span class="text-xs text-slate-500">当前比分</span>
      <span class="font-mono font-black text-lg anim-flash">${cs.p1} - ${cs.p2}</span>
    </div>` : ''}
    <div class="mt-4 text-[10px] text-slate-400 anim-pulse">即将继续比赛...</div>
  </div>`;
}

/* ================= 比赛结果 ================= */
function renderResult(){
  const t = STATE.currentTournament;
  if(!t || !t.result){ STATE.step='dashboard'; render(); return; }
  const r = t.result;
  const matches = r.matches||[];

  let title = '';
  if(t.isTeam){
    if(r.teamChampion) title = r.personalChampion ? '🏆 团体冠军！个人全胜' : '🏆 团体冠军！';
    else title = `止步 ${ROUND_NAMES[r.bestRound]||'首轮'}`;
  } else {
    title = r.personalChampion ? '🏆 冠军！' : `止步 ${ROUND_NAMES[r.bestRound]||'首轮'}`;
  }
  const isGold = r.personalChampion || r.teamChampion;

  return `<div class="text-center py-4 anim-scale">
    <div class="text-[11px] text-slate-500">${t.tier} · ${t.name}</div>
    <h2 class="text-2xl font-black mt-1 ${isGold?'text-amber-600':'text-slate-700'}">${title}</h2>
    ${t.isTeam?'<div class="text-[10px] text-amber-600 font-bold mt-1">团体赛 · 五场三胜</div>':''}
    <div class="flex justify-center gap-3 mt-2 text-xs">
      <span class="text-emerald-600 font-bold">+${r.points} 积分</span>
      <span class="text-slate-500">🔋 -${r.staminaCost||0} 体能</span>
      ${r.prizeMoney > 0 ? `<span class="text-amber-600 font-bold">💰 +¥${fmtMoney(r.prizeMoney)}万</span>` : ''}
    </div>
    <div class="mt-4 space-y-1.5 text-left">

/* ================= 训练系统 ================= */
function finishSeason(){
  const retired = applyAgeDecay();
  if(retired) return;
  STATE.rankPoints = Math.round(STATE.rankPoints * 0.7);
  aiPlayers.forEach(ai => { ai.points = Math.round(ai.points * 0.7); });
  updateWorldRank();
  addNews(`📅 ${STATE.seasonYear}赛季结束`,
    `战绩：${STATE.seasonStats.gp}场 ${STATE.seasonStats.wins}胜 ${STATE.seasonStats.losses}负，${STATE.seasonStats.titles||0}冠。最终排名#${STATE.worldRank}`,
    '赛季总结');

  const tp = getTrainingPoints(STATE.age);
  STATE.trainingState = {
    pointsLeft: tp,
    tempAllocated: {},
    tempSpent: 0,
    log: []
  };
  STATE.step = 'training';
  render();
}

function getAvailableTraining(){
  const ts = STATE.trainingState;
  if(!ts) return 0;
  return ts.pointsLeft - ts.tempSpent;
}

function addTrainPoint(k, amount, cost){
  const ts = STATE.trainingState;
  if(!ts) return;
  if(getAvailableTraining() < cost) return;
  const cur = (STATE.attrs[k]||50) + (ts.tempAllocated[k]||0);
  const cap = STATE.potential[k] || 99;
  if(cur >= cap) return;

  const coachBonus = getCoachBonus(k);
  const totalAdd = amount + coachBonus;
  const actual = Math.min(totalAdd, cap - cur);
  if(actual <= 0) return;

  ts.tempAllocated[k] = (ts.tempAllocated[k]||0) + actual;
  ts.tempSpent += cost;
  render();
}

function breakthrough(k){
  const ts = STATE.trainingState;
  if(!ts) return;
  if(getAvailableTraining() < 3) return;
  if((STATE.potential[k]||99) >= 99){ alert('该属性潜力已达上限99'); return; }
  ts.pointsLeft -= 3;
  const success = Math.random() < 0.5;
  if(success){
    STATE.potential[k] = clamp(STATE.potential[k] + 4, 0, 99);
    ts.log.push({k, success, gain:4});
  } else {
    ts.log.push({k, success, gain:0});
  }
  render();
}

function confirmTraining(){
  const ts = STATE.trainingState;
  if(!ts) return;
  ATTR_KEYS.forEach(k=>{
    const add = ts.tempAllocated[k]||0;
    if(add>0){
      STATE.attrs[k] = clamp(STATE.attrs[k] + add, 1, STATE.potential[k]);
    }
  });
  STATE.finalOVR = calcOVR(STATE.attrs);
  updateTraits();
  STATE.careerStats.breakthroughs = (STATE.careerStats.breakthroughs||0) + ts.log.filter(l=>l.success).length;
  checkAchievements();
  STATE.trainingState = null;
  nextSeason();
}

function renderTraining(){
  const ts = STATE.trainingState;
  if(!ts){ STATE.step='dashboard'; render(); return; }
  const available = getAvailableTraining();

  const cards = ATTR_KEYS.map(k=>{
    const v = STATE.attrs[k]||50;
    const add = ts.tempAllocated[k]||0;
    const display = v + add;
    const cap = STATE.potential[k]||99;
    const pct = Math.round(display/cap*100);
    const coachBonus = getCoachBonus(k);
    const canAdd1 = available >= 1 && display < cap;
    const canAdd2 = available >= 2 && display < cap;
    const canBreak = available >= 3 && cap < 99;
    const nearCap = display >= cap;
    return `<div class="p-3 rounded-xl border-2 ${nearCap?'border-amber-300 bg-amber-50/50':'border-slate-200 bg-white'}">
      <div class="flex items-center justify-between mb-1.5">
        <div class="flex items-center gap-1.5">
          <span class="text-base">${ATTR_ICON[k]}</span>
          <b class="text-sm">${ATTR_CN[k]}</b>
          ${coachBonus>0?`<span class="text-[9px] font-bold text-indigo-600 bg-indigo-100 px-1 py-0.5 rounded">👨‍🏫+${coachBonus}</span>`:''}
        </div>
        <div class="text-right">
          <span class="font-black text-sm">${display}</span>
          <span class="text-[10px] text-slate-400"> / ${cap}</span>
        </div>
      </div>
      <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden mb-2">
        <div class="h-full bg-gradient-to-r from-emerald-400 to-teal-400 bar rounded-full" style="width:${pct}%"></div>
      </div>
      <div class="grid grid-cols-3 gap-1">
        <button onclick="addTrainPoint('${k}',1,1)" ${canAdd1?'':'disabled'} class="btn text-[10px] font-bold py-1.5 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 disabled:bg-slate-100 disabled:text-slate-300">+${1+coachBonus} <span class="text-[8px]">(1点)</span></button>
        <button onclick="addTrainPoint('${k}',2,2)" ${canAdd2?'':'disabled'} class="btn text-[10px] font-bold py-1.5 rounded-lg bg-teal-100 text-teal-700 hover:bg-teal-200 disabled:bg-slate-100 disabled:text-slate-300">+${2+coachBonus}特训 <span class="text-[8px]">(2点)</span></button>
        <button onclick="breakthrough('${k}')" ${canBreak?'':'disabled'} class="btn text-[10px] font-bold py-1.5 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 disabled:bg-slate-100 disabled:text-slate-300">突破 <span class="text-[8px]">(3点)</span></button>
      </div>
    </div>`;
  }).join('');

  const logHtml = ts.log.length ? `<div class="mt-3 p-2.5 rounded-xl bg-slate-50 border border-slate-200">
    <div class="text-[10px] font-bold text-slate-600 mb-1">突破记录</div>
    ${ts.log.map(l=>`<div class="text-[10px] ${l.success?'text-emerald-600':'text-slate-400'}">
      ${l.success?'✅':'❌'} ${ATTR_CN[l.k]} 突破${l.success?`成功，上限+${l.gain}`:'失败'}
    </div>`).join('')}
  </div>` : '';

  return `<div class="anim-fade">
    <div class="text-center mb-3">
      <div class="text-3xl mb-1">🏋️</div>
      <h2 class="text-xl font-black">休赛期训练</h2>
      <p class="text-xs text-slate-500 mt-0.5">${STATE.age}岁 · 训练点 <b class="text-emerald-600 text-lg">${available}</b> / ${ts.pointsLeft}</p>

      💡 <b>特训</b>：消耗2点，属性+2（教练可额外加成）<br>
      💡 <b>突破</b>：消耗3点，50%概率使该属性潜力上限+4
    </div>

    <div class="space-y-1.5 max-h-[45vh] overflow-y-auto pr-1">${cards}</div>
    ${logHtml}

    <button onclick="confirmTraining()" class="btn w-full mt-4 bg-gradient-to-r from-emerald-600 to-teal-500 text-white font-bold py-3 rounded-xl shadow-md shadow-emerald-500/25">✅ 确认训练，进入下一赛季</button>
  </div>`;
}

function getHistoricalLegacy(){
  const c = STATE.careerStats;
  const titles = c.titles||0, wins = c.wins||0, gp = c.gp||0;
  const winRate = gp>0 ? wins/gp : 0;
  const super1000 = c.super1000||0, weeks = c.weeksAtNo1||0;
  const majorScore = (c.olympicGold||0)*18 + (c.worldsGold||0)*12 + (c.thomasUberCup||0)*9 + (c.sudirmanCup||0)*9;
  const score = titles*2.5 + super1000*1.8 + weeks*0.3 + winRate*30 + majorScore;
  let tier,grade,strengths,evalText;
  if(score>=80 || (c.olympicGold||0)>=2 || titles>=20){
    tier='🏆 羽坛传奇'; grade='历史顶级巨星';
    strengths=[`${titles}冠`,`${c.olympicGold||0}枚奥运金牌`,`${c.worldsGold||0}次世锦赛冠军`,`${weeks}周世界第一`];
    evalText='他是羽毛球历史上最伟大的选手之一，统治了一个时代。';
  } else if(score>=45 || titles>=10 || (c.olympicGold||0)>=1 || (c.worldsGold||0)>=1){
    tier='🌟 世界级巨星'; grade='羽坛名将';
    strengths=[`${titles}冠`,`${c.olympicGold||0}枚奥运金牌`,`${c.worldsGold||0}次世锦赛冠军`,`胜率${Math.round(winRate*100)}%`];
    evalText='他是一位世界级的羽毛球选手，拥有辉煌的职业生涯。';
  } else if(score>=20 || titles>=3 || super1000>=1){
    tier='🏅 国际级选手'; grade='巡回赛冠军级';
    strengths=[`${titles}冠`,`${super1000}个超级1000`,`最高排名#${c.bestRank||STATE.worldRank}`];
    evalText='他是一位出色的国际级选手，在BWF巡回赛中取得了不俗的成就。';
  } else {
    tier='🎯 职业选手'; grade='巡回赛常客';
    strengths=[`${titles}冠`,`胜率${Math.round(winRate*100)}%`];
    evalText='他是一位勤奋的职业选手，在羽毛球赛场上留下了自己的足迹。';
  }
  return {tier,grade,strengths:strengths.join('、')||'稳定的职业生涯',evalText};
}

          const tr = TRAITS[key];
          if(!tr) return '';
          return `<span class="trait-badge inline-flex items-center gap-0.5 px-2 py-0.5 rounded text-[10px] font-bold text-amber-800">${tr.icon}${tr.name}${lvl==='2'?'·极':''}</span>`;
        }).join('') : '<span class="text-[10px] text-amber-400">属性达到85即可觉醒特长</span>'}
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="p-3 rounded-xl bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-200 flex items-center justify-between">
        <div class="text-[11px] font-bold text-indigo-900">⚡ 关键分</div>
        <div class="text-base font-black text-indigo-600">${c.clutchAttempts>0?Math.round((c.clutchWins/c.clutchAttempts)*100):0}%</div>
      </div>
      <div class="p-3 rounded-xl bg-gradient-to-br from-amber-50 to-yellow-50 border border-amber-200 flex items-center justify-between">
        <div class="text-[11px] font-bold text-amber-900">💰 总奖金</div>
        <div class="text-base font-black text-amber-600">¥${fmtMoney(c.careerPrize||0)}万</div>
      </div>
    </div>
    <div class="p-3.5 rounded-xl bg-white border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-slate-700">🏅 成就</span>
        <span class="text-[10px] text-slate-500">${unlocked.length}/${ACHIEVEMENTS.length}</span>
      </div>
      <div class="grid grid-cols-2 gap-1.5">
        ${ACHIEVEMENTS.map(a=>{
          const done = unlocked.includes(a.id);
          return `<div class="p-2 rounded-lg border ${done?'border-emerald-200 bg-emerald-50':'border-slate-200 bg-slate-50'} flex items-center gap-1.5">
            <span class="text-base ${done?'':'grayscale opacity-40'}">${a.icon}</span>
            <div class="min-w-0">
              <div class="text-[11px] font-bold ${done?'text-emerald-700':'text-slate-400'} truncate">${a.name}</div>
              <div class="text-[9px] text-slate-400 truncate">${a.desc}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <button onclick="STATE.step='dashboard';render()" class="btn w-full mt-4 bg-slate-100 hover:bg-slate-200 font-semibold py-3 rounded-xl text-sm">返回</button>
  </div>`;
}

/* ================= 全局函数导出 ================= */
window.resetGame = resetGame;
window.beginBuild = beginBuild;
window.pickAttr = pickAttr;
window.rerollBuild = rerollBuild;
window.startCareer = startCareer;
window.playNextTournament = playNextTournament;
window.restAndSkip = restAndSkip;
window.resolveDecision = resolveDecision;
window.finishSeason = finishSeason;
window.addTrainPoint = addTrainPoint;
window.breakthrough = breakthrough;
window.confirmTraining = confirmTraining;
window.retireCareer = retireCareer;
window.buyEquipment = buyEquipment;
window.buyCoach = buyCoach;
window.switchShopTab = switchShopTab;

/* ================= 初始化 ================= */
(function init(){
  STATE = clone(INITIAL_STATE);
  STATE.tournaments = getSeasonTournaments(STATE.gender, STATE.seasonYear);
  initNamePools();
  aiPlayers = [];
  render();
})();
</script>
</body>
</html>
